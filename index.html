                    <option value="" ${!initialParentId ? 'selected' : ''}>None (Top-level Category)</option>
                    ${validParents.map(({ cat: c, depth }) => `
                      <option value="${c.id}" data-depth="${depth}" ${c.id === initialParentId ? 'selected' : ''}>${escapeHTML(getCategoryPathString(c.id, categories))}</option>
                    `).join('')}
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">Color Accent</label>
                  <div class="color-picker-grid" id="color-picker">
                    ${colorPalette.map(c => `
                      <div class="color-swatch ${c === selectedColor ? 'selected' : ''}" style="background-color: ${c};" data-color="${c}"></div>
                    `).join('')}
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Icon</label>
                  <div class="icon-picker-grid" id="icon-picker">
                    ${iconList.map(ic => `
                      <div class="icon-swatch ${ic === selectedIcon ? 'selected' : ''}" data-icon="${ic}">
                        <svg class="icon icon-sm"><use href="#icon-${ic}"/></svg>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="modal-footer" style="justify-content: ${isEdit ? 'space-between' : 'flex-end'};">
                ${isEdit ? `
                  <button class="btn btn-secondary" id="btn-delete-cat" style="color: var(--danger);">
                    <svg class="icon icon-sm"><use href="#icon-trash"/></svg> Delete
                  </button>
                ` : ''}
                <div style="display: flex; gap: 8px;">
                  <button class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
                  <button class="btn btn-primary" id="btn-submit-cat">
                    ${isEdit ? 'Save Changes' : (initialParentId ? 'Create Subcategory' : 'Create Category')}
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;

        const nameInput = document.getElementById('cat-name');
        const parentSelect = document.getElementById('cat-parent');
        enhanceCategorySelect(parentSelect);
        nameInput.focus();
        nameInput.oninput = () => nameInput.classList.remove('invalid');
        nameInput.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('btn-submit-cat').click();
          }
        };

        // Color selection
        document.querySelectorAll('.color-swatch').forEach(sw => {
          sw.onclick = () => {
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
            sw.classList.add('selected');
            selectedColor = sw.getAttribute('data-color');
          };
        });

        // Icon selection
        document.querySelectorAll('.icon-swatch').forEach(sw => {
          sw.onclick = () => {
            document.querySelectorAll('.icon-swatch').forEach(s => s.classList.remove('selected'));
            sw.classList.add('selected');
            selectedIcon = sw.getAttribute('data-icon');
          };
        });

        const closeModal = () => { modalContainer.innerHTML = ''; };
        document.getElementById('btn-close-modal').onclick = closeModal;
        document.getElementById('btn-cancel-modal').onclick = closeModal;

        if (isEdit) {
          document.getElementById('btn-delete-cat').onclick = () => {
            closeModal();
            openDeleteCategoryModal(existing);
          };
        }

        document.getElementById('btn-submit-cat').onclick = () => {
          const name = Sanitize.text(nameInput.value.trim(), 200);
          if (!name) {
            nameInput.focus();
            nameInput.classList.remove('invalid'); void nameInput.offsetWidth; nameInput.classList.add('invalid');
            showToast('Please enter a category name', 'danger');
            return;
          }
          selectedColor = Sanitize.color(selectedColor);
          selectedIcon = Sanitize.icon(selectedIcon);
          const parentId = parentSelect ? parentSelect.value : '';

          if (isEdit) {
            AppState.recordAction(`Edit Category "${name}"`);
            const cat = AppState.data.categories.find(c => c.id === existing.id);
            if (cat) {
              cat.name = name;
              cat.color = selectedColor;
              cat.icon = selectedIcon;
              if (!forbiddenIds.has(parentId)) {
                cat.parentId = parentId || '';
              }
            }
            showToast('Category updated', 'success', {
              label: 'Undo',
              onClick: () => HistoryManager.undo()
            });
          } else {
            AppState.recordAction(`Create Category "${name}"`);
            const newCat = {
              id: 'cat-' + Date.now(),
              name,
              color: selectedColor,
              icon: selectedIcon,
              order: AppState.data.categories.length,
              parentId: parentId || ''
            };
            AppState.data.categories.push(newCat);
            if (parentId) AppState.collapsedCats.delete(parentId);
            AppState.activeCategory = newCat.id;
            showToast(`Created ${parentId ? 'subcategory' : 'category'} "${name}"`, 'success', {
              label: 'Undo',
              onClick: () => HistoryManager.undo()
            });
          }

          AppState.saveDirty();
          closeModal();
          renderApp();
        };
      }

      function openDeleteCategoryModal(cat) {
        const descIds = getCategoryDescendants(cat.id);
        const childCatCount = descIds.size - 1;
        const bookmarksInTree = AppState.data.bookmarks.filter(b => descIds.has(b.categoryId) && !b.isTrash);
        const directBookmarks = AppState.data.bookmarks.filter(b => b.categoryId === cat.id && !b.isTrash);
        const count = bookmarksInTree.length;

        const modalContainer = document.getElementById('modal-container');
        modalContainer.innerHTML = `
          <div class="modal-overlay active">
            <div class="modal" style="max-width: 480px;">
              <div class="modal-header">
                <h3 class="modal-title" style="display: flex; align-items: center; gap: 8px; color: var(--danger);">
                  <svg class="icon"><use href="#icon-trash"/></svg>
                  Delete Category "${escapeHTML(cat.name)}"
                </h3>
                <button class="btn btn-icon-only" id="btn-close-del-cat">
                  <svg class="icon"><use href="#icon-x"/></svg>
                </button>
              </div>

              <div class="modal-body">
                ${count === 0 && childCatCount === 0 ? `
                  <p style="font-size: 0.9rem; color: var(--text-main);">
                    Are you sure you want to delete the category <b>"${escapeHTML(cat.name)}"</b>? It currently contains no bookmarks.
                  </p>
                ` : `
                  <p style="font-size: 0.92rem; color: var(--text-main); margin-bottom: 8px;">
                    This category contains <b>${count} bookmark${count === 1 ? '' : 's'}</b>${childCatCount > 0 ? ` and <b>${childCatCount} subfolder${childCatCount === 1 ? '' : 's'}</b>` : ''}.
                  </p>
                  <p style="font-size: 0.84rem; color: var(--text-muted); line-height: 1.4;">
                    What would you like to do with the contents inside this category?
                  </p>
                `}
              </div>

              <div class="modal-footer" style="flex-direction: column; gap: 8px; align-items: stretch;">
                ${count > 0 || childCatCount > 0 ? `
                  <button class="btn btn-primary" id="btn-del-cat-keep" style="justify-content: center;">
                    Keep Bookmarks ${childCatCount > 0 ? '& Subfolders ' : ''}(Move to ${cat.parentId ? 'Parent Folder' : 'All Bookmarks'})
                  </button>
                  <button class="btn btn-secondary" id="btn-del-cat-delete-all" style="justify-content: center; color: var(--danger); border-color: rgba(239, 68, 68, 0.4);">
                    Delete Category${childCatCount > 0 ? ', Subfolders' : ''} & All ${count} Bookmarks
                  </button>
                ` : `
                  <button class="btn btn-secondary" id="btn-del-cat-confirm-empty" style="justify-content: center; color: var(--danger); border-color: rgba(239, 68, 68, 0.4);">
                    Delete Category
                  </button>
                `}
                <button class="btn btn-secondary" id="btn-del-cat-cancel" style="justify-content: center;">
                  Cancel
                </button>
              </div>
            </div>
          </div>
        `;

        const closeModal = () => { modalContainer.innerHTML = ''; };
        document.getElementById('btn-close-del-cat').onclick = closeModal;
        document.getElementById('btn-del-cat-cancel').onclick = closeModal;

        const removeCategoryOnly = () => {
          AppState.recordAction(`Delete Category "${cat.name}"`);
          const remainingCats = AppState.data.categories.filter(c => c.id !== cat.id);
          // Promote direct child subfolders to cat.parentId (or top-level)
          remainingCats.forEach(c => {
            if (c.parentId === cat.id) c.parentId = cat.parentId || '';
          });
          const fallbackCatId = (cat.parentId && remainingCats.some(c => c.id === cat.parentId))
            ? cat.parentId
            : (remainingCats[0]?.id || 'cat-general');
          directBookmarks.forEach(b => {
            b.categoryId = fallbackCatId;
          });
          AppState.data.categories = remainingCats;
          if (AppState.activeCategory === cat.id) {
            AppState.activeCategory = cat.parentId || 'all';
          }
          AppState.saveDirty();
          closeModal();
          renderApp();
          showToast(`Category "${cat.name}" deleted. Bookmarks kept.`, 'info', {
            label: 'Undo',
            onClick: () => HistoryManager.undo()
          });
        };

        const removeCategoryAndBookmarks = () => {
          AppState.recordAction(`Delete Category "${cat.name}" & Bookmarks`);
          bookmarksInTree.forEach(b => {
            b.isTrash = true;
          });
          AppState.data.categories = AppState.data.categories.filter(c => !descIds.has(c.id));
          if (descIds.has(AppState.activeCategory)) {
            AppState.activeCategory = cat.parentId || 'all';
          }
          AppState.saveDirty();
          closeModal();
          renderApp();
          showToast(`Category "${cat.name}" and ${count} bookmarks deleted`, 'info', {
            label: 'Undo',
            onClick: () => HistoryManager.undo()
          });
        };

        if (count > 0 || childCatCount > 0) {
          document.getElementById('btn-del-cat-keep').onclick = removeCategoryOnly;
          document.getElementById('btn-del-cat-delete-all').onclick = removeCategoryAndBookmarks;
        } else {
          document.getElementById('btn-del-cat-confirm-empty').onclick = removeCategoryOnly;
        }
      }

      /* ===== src/js/19a-data-tools.js ===== */
      /* --------------------------------------------------------------------------
         15a. DATA TOOLS — JSON import, duplicate finder, tag manager, offline icons
         Every change records an undo step first, so each tool can be undone.
         -------------------------------------------------------------------------- */
      const DataTools = {
        /* ---------- JSON import (the file made by "Export JSON") ---------- */
        async importJSON(text) {
          let parsed;
          try { parsed = JSON.parse(text); } catch (e) { showToast('That file is not valid JSON', 'danger'); return false; }
          const incoming = sanitizeData(parsed);
          if (!incoming) { showToast('That JSON file has no ProMarker bookmarks in it', 'danger'); return false; }
          delete incoming._lastSaved;
          delete incoming._backupTime;
          const n = incoming.bookmarks.filter(b => !b.isTrash).length;

          const choice = await confirmDialog({
            title: `Import ${n} ${n === 1 ? 'bookmark' : 'bookmarks'}?`,
            message: 'Merge adds the new links and categories to what you have (duplicates are skipped). Replace swaps everything here, including settings, for the file’s contents.',
            icon: 'upload',
            buttons: [
              { label: 'Cancel', value: null, kind: 'secondary' },
              { label: 'Replace Everything', value: 'replace', kind: 'secondary btn-danger-ghost' },
              { label: 'Merge', value: 'merge', kind: 'primary', focus: true },
            ],
            dismissValue: null,
          });
          if (!choice) return false;

          AppState.recordAction(choice === 'merge' ? 'Merge JSON Import' : 'Replace from JSON');
          if (choice === 'replace') {
            AppState.data = incoming;
            AppState.activeCategory = 'all';
            AppState.activeTag = null;
            AppState.selectedIds.clear();
            applyTheme(incoming.settings.theme || 'system');
            AppState.saveDirty();
            showToast(`Replaced with ${n} imported bookmarks`, 'success', { label: 'Undo', onClick: () => HistoryManager.undo() });
            return true;
          }

          // Merge: match categories by name, give everything fresh ids, skip known URLs
          const data = AppState.data;
          const usedCat = new Set(data.categories.map(c => c.id));
          const byName = new Map(data.categories.map(c => [c.name.trim().toLowerCase(), c.id]));
          const catMap = new Map();
          const addedCats = [];
          incoming.categories.forEach((c) => {
            const key = c.name.trim().toLowerCase();
            if (byName.has(key) && !c.parentId) { catMap.set(c.id, byName.get(key)); return; }
            const id = Sanitize.id('', 'cat', usedCat);
            const clone = Object.assign({}, c, { id, order: data.categories.length, _origParent: c.parentId || '' });
            data.categories.push(clone);
            addedCats.push(clone);
            byName.set(key, id);
            catMap.set(c.id, id);
          });
          addedCats.forEach((c) => {
            c.parentId = c._origParent ? (catMap.get(c._origParent) || '') : '';
            delete c._origParent;
          });
          const fallbackCat = () => {
            if (data.categories.length) return data.categories[0].id;
            const id = Sanitize.id('', 'cat', usedCat);
            data.categories.push({ id, name: 'Imported', icon: 'folder', color: '#6366f1', order: 0 });
            return id;
          };
          const seen = new Set(data.bookmarks.filter(b => !b.isTrash).map(b => normalizeUrlKey(b.url)));
          const usedBm = new Set(data.bookmarks.map(b => b.id));
          let order = data.bookmarks.reduce((m, b) => Math.max(m, b.order || 0), 0);
          let added = 0, skipped = 0;
          incoming.bookmarks.filter(b => !b.isTrash).forEach((b) => {
            const key = normalizeUrlKey(b.url);
            if (!key || seen.has(key)) { skipped++; return; }
            seen.add(key);
            data.bookmarks.push(Object.assign({}, b, {
              id: Sanitize.id('', 'bm', usedBm),
              categoryId: catMap.get(b.categoryId) || fallbackCat(),
              order: ++order,
            }));
            added++;
          });
          AppState.saveDirty();
          showToast(`Imported ${added} ${added === 1 ? 'link' : 'links'}` + (skipped ? ` · skipped ${skipped} already here` : ''), 'success', { label: 'Undo', onClick: () => HistoryManager.undo() });
          return true;
        },

        /* ---------- Duplicates ---------- */
        // Groups of 2+ live bookmarks pointing at the same address. The first item is the one kept:
        // favorite first, then most visited, then oldest.
        findDuplicates() {
          const groups = new Map();
          AppState.data.bookmarks.filter(b => !b.isTrash).forEach((b) => {
            const key = normalizeUrlKey(b.url);
            if (!key) return;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(b);
          });
          return [...groups.values()].filter(g => g.length > 1).map(g => g.sort((a, b) =>
            (b.isFavorite - a.isFavorite) || ((b.clickCount || 0) - (a.clickCount || 0)) || ((a.createdAt || 0) - (b.createdAt || 0))));
        },

        // Keep one per group; fold the others' tags, notes, visits and star into it, then trash them.
        mergeDuplicates() {
          const groups = this.findDuplicates();
          if (!groups.length) return 0;
          AppState.recordAction('Merge Duplicates');
          let moved = 0;
          groups.forEach(([keep, ...extras]) => {
            extras.forEach((x) => {
              keep.tags = Array.from(new Set([...(keep.tags || []), ...(x.tags || [])]));
              if (!keep.description && x.description) keep.description = x.description;
              else if (x.description && x.description !== keep.description) keep.description += '\n\n' + x.description;
              keep.clickCount = (keep.clickCount || 0) + (x.clickCount || 0);
              keep.isFavorite = keep.isFavorite || x.isFavorite;
              keep.lastVisitedAt = Math.max(keep.lastVisitedAt || 0, x.lastVisitedAt || 0) || undefined;
              x.isTrash = true;
              x.updatedAt = Date.now();
              moved++;
            });
            keep.updatedAt = Date.now();
          });
          AppState.selectedIds.clear();
          AppState.saveDirty();
          return moved;
        },

        openDuplicatesModal() {
          const groups = this.findDuplicates();
          const extras = groups.reduce((n, g) => n + g.length - 1, 0);
          const mc = document.getElementById('modal-container');
          const catName = (id) => (AppState.data.categories.find(c => c.id === id) || {}).name || 'No category';
          mc.innerHTML = `
            <div class="modal-overlay active">
              <div class="modal dup-modal">
                <div class="modal-header">
                  <div>
                    <h3 class="modal-title">Duplicate links</h3>
                    <p class="modal-subtitle">${groups.length ? `${groups.length} ${groups.length === 1 ? 'address is' : 'addresses are'} saved more than once` : 'Every link is saved only once'}</p>
                  </div>
                  <button class="btn btn-icon-only" id="btn-close-modal" title="Close"><svg class="icon"><use href="#icon-x"/></svg></button>
                </div>
                <div class="modal-body">
                  ${groups.length ? groups.map(g => `
                    <div class="dup-group">
                      ${g.map((b, i) => `
                        <div class="dup-item ${i === 0 ? 'keep' : ''}">
                          <div class="dup-text">
                            <span class="dup-title">${escapeHTML(b.title || b.url)}</span>
                            <span class="dup-meta">${escapeHTML(catName(b.categoryId))}${b.tags && b.tags.length ? ' · #' + b.tags.map(escapeHTML).join(' #') : ''}${b.clickCount ? ' · ' + b.clickCount + ' clicks' : ''}</span>
                          </div>
                          <span class="dup-badge ${i === 0 ? 'keep' : ''}">${i === 0 ? 'Keep' : 'Merge in'}</span>
                        </div>`).join('')}
                      <div class="dup-url">${escapeHTML(extractDomain(g[0].url) || g[0].url)}</div>
                    </div>`).join('') : `
                    <div class="empty-state compact-empty">
                      <div class="empty-icon-box"><svg class="icon icon-lg"><use href="#icon-check"/></svg></div>
                      <div class="empty-title">No duplicates</div>
                    </div>`}
                </div>
                <div class="modal-footer">
                  ${groups.length ? `<span class="modal-footer-note">Tags, notes, visits and stars are combined into the kept link. The others go to Trash.</span>` : ''}
                  <button class="btn btn-secondary" id="btn-dup-back">Back</button>
                  ${groups.length ? `<button class="btn btn-primary" id="btn-dup-merge">Merge ${extras} ${extras === 1 ? 'Duplicate' : 'Duplicates'}</button>` : ''}
                </div>
              </div>
            </div>`;
          const back = () => { settingsLastTab = 'data'; openSettingsModal(); };
          document.getElementById('btn-close-modal').onclick = () => { mc.innerHTML = ''; };
          document.getElementById('btn-dup-back').onclick = back;
          const merge = document.getElementById('btn-dup-merge');
          if (merge) merge.onclick = () => {
            const moved = this.mergeDuplicates();
            mc.innerHTML = '';
            renderApp();
            showToast(`Merged ${moved} ${moved === 1 ? 'duplicate' : 'duplicates'}`, 'success', { label: 'Undo', onClick: () => HistoryManager.undo() });
          };
        },

        /* ---------- Tags ---------- */
        tagCounts() {
          const counts = new Map();
          AppState.data.bookmarks.filter(b => !b.isTrash).forEach(b => (b.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
          return [...counts.entries()].sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]));
        },

        // Renaming onto an existing tag merges the two. Trashed bookmarks are updated too.
        renameTag(from, to) {
          to = String(to || '').trim().toLowerCase().replace(/^#+/, '').replace(/\s+/g, '-').slice(0, 60);
          if (!to || to === from || !AppState.data.bookmarks.some(b => (b.tags || []).includes(from))) return false;
          const merging = AppState.data.bookmarks.some(b => (b.tags || []).includes(to));
          AppState.recordAction(`${merging ? 'Merge' : 'Rename'} Tag #${from}`);
          AppState.data.bookmarks.forEach((b) => {
            if (!(b.tags || []).includes(from)) return;
            b.tags = Array.from(new Set(b.tags.map(t => (t === from ? to : t))));
          });
          if (AppState.activeTag === from) AppState.activeTag = to;
          AppState.saveDirty();
          showToast(merging ? `Merged #${from} into #${to}` : `Renamed #${from} to #${to}`, 'success', { label: 'Undo', onClick: () => HistoryManager.undo() });
          return true;
        },

        deleteTag(tag) {
          AppState.recordAction(`Delete Tag #${tag}`);
          AppState.data.bookmarks.forEach((b) => { if ((b.tags || []).includes(tag)) b.tags = b.tags.filter(t => t !== tag); });
          if (AppState.activeTag === tag) AppState.activeTag = null;
          AppState.saveDirty();
          showToast(`Removed #${tag}`, 'info', { label: 'Undo', onClick: () => HistoryManager.undo() });
        },
      };

      /* ---------- Offline icons ----------
         With "Keep icons offline" on, each site's icon is drawn into a small PNG and stored
         with the bookmark (b.favicon, ~2–4 KB), so cards show real icons with no network. */
      const IconCache = {
        running: false,
        tried: new Set(),     // domains that failed this session (not retried until reload)

        pending() {
          return AppState.data.bookmarks.filter(b => {
            if (b.isTrash || b.favicon) return false;
            const d = extractDomain(b.url);
            return isPublicFaviconDomain(d) && !this.tried.has(d);
          });
        },

        // Icon services that send CORS headers, so the image can be read back into a PNG.
        // (Google's favicon service, used for normal display, does not allow that.) Only the domain is sent.
        sources: [
          (d) => `https://icon.horse/icon/${encodeURIComponent(d)}`,
          (d) => `https://favicone.com/${encodeURIComponent(d)}?s=64`,
        ],

        async capture(domain) {
          for (const src of this.sources) {
            const url = await this.captureFrom(src(domain));
            if (url) return url;
          }
          return null;
        },

        captureFrom(src) {
          return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';    // needed to read the pixels back
            img.referrerPolicy = 'no-referrer';
            const done = (v) => { clearTimeout(timer); resolve(v); };
            const timer = setTimeout(() => done(null), 8000);
            img.onload = () => {
              try {
                if (!img.naturalWidth) return done(null);
                const c = document.createElement('canvas');
                c.width = c.height = 48;   // shown at 20px: sharp on 2x screens
                const ctx = c.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, 48, 48);
                const url = c.toDataURL('image/png');
                done(url.length <= FAVICON_MAX ? url : null);
              } catch (e) { done(null); } // image without CORS: canvas is tainted
            };
            img.onerror = () => done(null);
            img.src = src;
          });
        },

        async fill() {
          if (this.running || !AppState.data.settings.offlineIcons) return;
          const todo = this.pending();
          if (!todo.length) return;
          this.running = true;
          const domains = [...new Set(todo.map(b => extractDomain(b.url)))];
          const results = new Map();
          let i = 0;
          const worker = async () => {
            while (i < domains.length) {
              const d = domains[i++];
              const url = await this.capture(d);
              if (url) results.set(d, url); else this.tried.add(d);
            }
          };
          await Promise.all([worker(), worker(), worker(), worker()]);
          this.running = false;
          if (!AppState.data.settings.offlineIcons || !results.size) return;
          let stored = 0;
          AppState.data.bookmarks.forEach((b) => {
            const url = !b.favicon && results.get(extractDomain(b.url));
            if (url) { b.favicon = url; stored++; }
          });
          // Not an undo step: it only adds cached icons, never changes what the user wrote
          if (stored) AppState.saveDirty();
        },

        clear() {
          AppState.data.bookmarks.forEach((b) => { delete b.favicon; });
          this.tried.clear();
          AppState.saveDirty();
        },

        bytes() {
          return AppState.data.bookmarks.reduce((n, b) => n + (b.favicon ? b.favicon.length : 0), 0);
        },
      };

      // Fill in missing icons a moment after the app settles (and after each change)
      AppState.subscribe(() => {
        if (!AppState.data.settings.offlineIcons || IconCache.running) return;
        clearTimeout(IconCache._t);
        IconCache._t = setTimeout(() => IconCache.fill(), 1500);
      });
      setTimeout(() => IconCache.fill(), 2000);

      /* ===== src/js/20-keyboard.js ===== */
      /* --------------------------------------------------------------------------
         12. GLOBAL KEYBOARD SHORTCUTS
         -------------------------------------------------------------------------- */
      const isTyping = () => {
        const el = document.activeElement;
        return !!el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable);
      };
      const modalOpen = () => {
        const mc = document.getElementById('modal-container');
        return !!(mc && mc.children.length);
      };

      window.addEventListener('keydown', (e) => {
        const mod = e.metaKey || e.ctrlKey;
        const key = (e.key || '').toLowerCase();

        // Cmd/Ctrl+S: save (works even while typing, and with Caps Lock on)
        if (mod && !e.altKey && key === 's') {
          e.preventDefault();
          QuineEngine.save();
          return;
        }

        // Cmd/Ctrl+Z: undo · Cmd/Ctrl+Shift+Z or Ctrl+Y: redo (native undo inside text fields)
        if (mod && !e.shiftKey && key === 'z' && !isTyping()) {
          e.preventDefault();
          HistoryManager.undo();
          return;
        }
        if (((mod && e.shiftKey && key === 'z') || (e.ctrlKey && !e.shiftKey && key === 'y')) && !isTyping()) {
          e.preventDefault();
          HistoryManager.redo();
          return;
        }

        // Cmd/Ctrl+K or "/": focus search
        if ((mod && key === 'k') || (e.key === '/' && !e.shiftKey && !mod && !isTyping() && !modalOpen())) {
          e.preventDefault();
          if (AppState.isNarrow() && !AppState.sidebarCollapsed) { AppState.sidebarCollapsed = true; renderApp(); }
          const searchInput = document.getElementById('global-search');
          if (searchInput) { searchInput.focus(); searchInput.select(); }
          return;
        }

        // N: new bookmark (no modifiers, not while typing or in a dialog)
        if (key === 'n' && !mod && !e.altKey && !isTyping() && !modalOpen()) {
          e.preventDefault();
          openBookmarkModal();
          return;
        }

        // Enter submits the bookmark dialog from any single-line field
        if (e.key === 'Enter' && mod) {
          const submit = document.getElementById('btn-submit-bookmark');
          if (submit) { e.preventDefault(); submit.click(); return; }
        }

        // Escape: close the top-most thing only
        if (e.key === 'Escape') {
          if (NotesPopover.el) { NotesPopover.hide(true); return; }
          if (ContextMenuManager.activeMenu) { ContextMenuManager.hide(); return; }
          if (modalOpen()) { document.getElementById('modal-container').innerHTML = ''; return; }
          if (document.activeElement && document.activeElement.id === 'global-search' && AppState.searchQuery) {
            AppState.searchQuery = ''; renderApp(); return;
          }
          if (AppState.isNarrow() && !AppState.sidebarCollapsed) { AppState.sidebarCollapsed = true; renderApp(); return; }
          if (AppState.selectedIds.size) { AppState.selectedIds.clear(); renderApp(); }
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        }
      });

      // Warn before closing if edits have not reached the file yet
      window.addEventListener('beforeunload', (e) => {
        // Unlinked edits are kept in the browser backup and come back on reopen, so only warn
        // when a linked file is still waiting for a write.
        // After a version update, edits are safe in the browser backup and come back on reload
        if (AppState.codeUpdated) return;
        if (!AppState.fileHandle || (!AppState.isDirty && !AppState.isSaving)) return;
        if (AppState.writePermission === 'granted') QuineEngine.autoSave();
        e.preventDefault();
        e.returnValue = '';
      });

      // Collapse sidebar into a drawer when the window gets narrow
      let wasNarrow = AppState.isNarrow();
      window.addEventListener('resize', () => {
        const narrow = AppState.isNarrow();
        if (narrow !== wasNarrow) { wasNarrow = narrow; AppState.sidebarCollapsed = narrow; renderApp(); }
      });

      /* ===== src/js/21-keyboard-nav.js ===== */
      /* --------------------------------------------------------------------------
         12B. KEYBOARD NAVIGATION (cards, sidebar, context menu, shortcut help)
         Arrows / j k move · Enter opens · Space selects · e edit · f favorite
         c copy · Delete trash · m move · [ ] switch view · ? help
         -------------------------------------------------------------------------- */
      const KeyNav = {
        // True while the user is steering with the keyboard; keeps focus on a card across re-renders
        active: false,

        cards() {
          return Array.from(document.querySelectorAll('#bookmarks-grid .bookmark-card'));
        },

        cardById(id) {
          return id ? document.querySelector(`#bookmarks-grid .bookmark-card[data-id="${CSS.escape(id)}"]`) : null;
        },

        current() {
          const el = document.activeElement && document.activeElement.closest
            ? document.activeElement.closest('#bookmarks-grid .bookmark-card') : null;
          return el || this.cardById(AppState.focusedId);
        },

        focus(card, { scroll = true } = {}) {
          if (!card) return;
          this.cards().forEach(c => c.setAttribute('tabindex', '-1'));
          card.setAttribute('tabindex', '0');
          AppState.focusedId = card.getAttribute('data-id');
          card.focus({ preventScroll: true });
          if (scroll) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        },

        // Called at the end of every renderApp(): roving tabindex + restore keyboard focus
        restore() {
          const cards = this.cards();
          if (!cards.length) return;
          const target = this.cardById(AppState.focusedId) || cards[0];
          target.setAttribute('tabindex', '0');
          if (this.active && !document.querySelector('#modal-container > *')) {
            const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
            if (!typing) target.focus({ preventScroll: true });
          }
        },

        // Grid-aware movement: up/down pick the nearest card in the row above/below
        neighbour(card, dir) {
          const cards = this.cards();
          const i = cards.indexOf(card);
          if (i === -1) return cards[0];
          if (dir === 'left') return cards[Math.max(0, i - 1)];
          if (dir === 'right') return cards[Math.min(cards.length - 1, i + 1)];
          if (dir === 'home') return cards[0];
          if (dir === 'end') return cards[cards.length - 1];

          const r = card.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const rows = cards
            .map(c => ({ c, r: c.getBoundingClientRect() }))
            .filter(o => dir === 'down' ? o.r.top > r.top + 4 : o.r.top < r.top - 4);
          if (!rows.length) return card;
          const rowTop = dir === 'down' ? Math.min(...rows.map(o => o.r.top)) : Math.max(...rows.map(o => o.r.top));
          return rows
            .filter(o => Math.abs(o.r.top - rowTop) < 4)
            .sort((a, b) => Math.abs(a.r.left + a.r.width / 2 - cx) - Math.abs(b.r.left + b.r.width / 2 - cx))[0].c;
        },

        move(dir, extendSelection) {
          const from = this.current();
          const to = from ? this.neighbour(from, dir) : this.cards()[0];
          if (!to) return;
          this.active = true;
          if (extendSelection) {
            if (from) AppState.selectedIds.add(from.getAttribute('data-id'));
            AppState.selectedIds.add(to.getAttribute('data-id'));
            AppState.focusedId = to.getAttribute('data-id');
            renderApp();
            this.focus(this.cardById(AppState.focusedId));
            return;
          }
          this.focus(to);
        },

        press(card, selector) {
          const btn = card && card.querySelector(selector);
          if (btn) { btn.click(); return true; }
          return false;
        },

        openCard(card, background) {
          const link = card && card.querySelector('.card-title');
          if (!link) return;
          if (background) {
            const bm = AppState.data.bookmarks.find(b => b.id === card.getAttribute('data-id'));
            if (bm) {
              if (!openSafely(bm.url)) return;
              if (AppState.data.settings.trackClicks) {
                bm.clickCount = (bm.clickCount || 0) + 1;
                bm.lastVisitedAt = Date.now();
                AppState.saveDirty();
              }
            }
            return;
          }
          link.click();
        },

        // Jump straight to a view ('all', 'favorites', …) or a category id
        goView(id) {
          if (!id) return;
          AppState.activeCategory = id;
          AppState.activeTag = null;
          AppState.selectedIds.clear();
          AppState.focusedId = null;
          if (AppState.isNarrow()) AppState.sidebarCollapsed = true;
          renderApp();
          const first = this.cards()[0];
          if (first && this.active) this.focus(first, { scroll: false });
        },

        // Step through the sidebar: All, Favorites, Recent, Archive, Trash, then each category
        switchView(step) {
          const ids = ['all', 'favorites', 'recent', 'archive', 'trash', ...getCategoryTree(AppState.data.categories).map(x => x.cat.id)];
          const i = Math.max(0, ids.indexOf(AppState.activeCategory));
          this.goView(ids[(i + step + ids.length) % ids.length]);
        },

        menuKeys(e) {
          const menu = ContextMenuManager.activeMenu;
          const items = Array.from(menu.querySelectorAll(':scope > .context-menu-item'));
          if (!items.length) return false;
          let i = items.findIndex(el => el.classList.contains('kbd-active'));
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (i !== -1) items[i].classList.remove('kbd-active');
            i = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
            items[i].classList.add('kbd-active');
            return true;
          }
          if (e.key === 'Enter' && i !== -1) {
            e.preventDefault();
            const sub = items[i].querySelector('.context-submenu');
            if (sub) { items[i].classList.add('kbd-open'); return true; }
            items[i].click();
            return true;
          }
          return false;
        },

        showHelp() {
          const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
          const mod = isMac ? '⌘' : 'Ctrl';
          const groups = [
            ['Navigate', [['↑ ↓ ← →', 'Move between bookmarks'], ['J · K', 'Next / previous'], ['Home · End', 'First / last'], ['A', 'All bookmarks'], ['B', 'Favorites'], ['V', 'Archive'], ['1 – 9', 'Category by sidebar position'], ['[ · ]', 'Previous / next view or category'], ['/ · ' + mod + ' K', 'Search'], ['↓', 'From search: jump to results']]],
            ['Act on bookmark', [['Enter', 'Open'], [mod + ' Enter', 'Open in background tab'], ['E', 'Edit'], ['I', 'Show notes'], ['F', 'Favorite'], ['Y', 'Archive / unarchive'], ['C', 'Copy as link'], ['Double-click', 'Copy as link (mouse)'], ['M', 'Move to category'], ['Delete', 'Move to Trash'], ['R', 'Restore (in Trash)'], ['Shift F10', 'Context menu']]],
            ['Select', [['Space · X', 'Select or deselect'], ['Shift ↑ ↓ ← →', 'Extend selection'], [mod + ' A', 'Select all shown'], ['Esc', 'Clear selection / close']]],
            ['App', [['N', 'New bookmark'], [mod + ' S', 'Save'], [mod + ' Z', 'Undo'], [mod + ' Shift Z', 'Redo'], ['?', 'This help']]],
          ];
          const kbd = (k) => k.split(' ').map(p => p === '·' ? '<span class="kbd-sep">or</span>'
            : p === '–' ? '<span class="kbd-sep">to</span>' : `<kbd class="kbd">${escapeHTML(p)}</kbd>`).join('');
          document.getElementById('modal-container').innerHTML = `
            <div class="modal-overlay active">
              <div class="modal" style="max-width: 640px;">
                <div class="modal-header">
                  <h3 class="modal-title">Keyboard shortcuts</h3>
                  <button class="btn btn-icon-only" id="btn-close-modal"><svg class="icon"><use href="#icon-x"/></svg></button>
                </div>
                <div class="modal-body shortcut-help">
                  ${groups.map(([title, rows]) => `
                    <section>
                      <h4>${title}</h4>
                      ${rows.map(([k, label]) => `<div class="shortcut-row"><span>${label}</span><span class="shortcut-keys">${kbd(k)}</span></div>`).join('')}
                    </section>`).join('')}
                </div>
              </div>
            </div>`;
          document.getElementById('btn-close-modal').onclick = () => { document.getElementById('modal-container').innerHTML = ''; };
        },

        onKeyDown(e) {
          if (e.defaultPrevented || e.isComposing) return;
          const mod = e.metaKey || e.ctrlKey;
          const el = document.activeElement;
          const typing = el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable);
          const modal = !!document.querySelector('#modal-container > *');

          if (ContextMenuManager.activeMenu && this.menuKeys(e)) return;
          if (modal) return;

          // From search: ↓ jumps into results, Enter opens the first result
          if (el && el.id === 'global-search') {
            if (e.key === 'ArrowDown' && this.cards().length) { e.preventDefault(); this.active = true; this.focus(this.cards()[0]); }
            else if (e.key === 'Enter' && this.cards().length) { e.preventDefault(); this.openCard(this.cards()[0], mod); }
            return;
          }
          if (typing) return;

          if (e.key === '?' || (e.shiftKey && (e.key === '/' || e.code === 'Slash'))) { e.preventDefault(); this.showHelp(); return; }
          // A = All bookmarks, B = Favorites, V = Archive, 1–9 = categories in sidebar order
          if (!mod && !e.altKey && !e.shiftKey) {
            const lower = e.key.toLowerCase();
            if (lower === 'a') { e.preventDefault(); this.goView('all'); return; }
            if (lower === 'b') { e.preventDefault(); this.goView('favorites'); return; }
            if (lower === 'v') { e.preventDefault(); this.goView('archive'); return; }
            if (/^[1-9]$/.test(e.key)) {
              const tree = getCategoryTree(AppState.data.categories);
              const entry = tree[Number(e.key) - 1];
              e.preventDefault();
              if (entry && entry.cat) this.goView(entry.cat.id); else showToast(`No category ${e.key} yet`, 'info');
              return;
            }
          }

          const bracket = e.key === '[' || e.code === 'BracketLeft' ? -1 : (e.key === ']' || e.code === 'BracketRight' ? 1 : 0);
          if (!mod && !e.altKey && bracket) { e.preventDefault(); this.switchView(bracket); return; }

          const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Home: 'home', End: 'end' };
          if (!mod && !e.altKey && dirs[e.key]) {
            // Don't hijack arrows while a sidebar item / button has focus, except from cards or the page
            if (el && el !== document.body && !el.closest('#bookmarks-grid') && !el.closest('.main-view')) return;
            e.preventDefault();
            this.move(dirs[e.key], e.shiftKey && !['home', 'end'].includes(dirs[e.key]));
            return;
          }
          if (!mod && !e.altKey && (e.key === 'j' || e.key === 'k')) { e.preventDefault(); this.move(e.key === 'j' ? 'right' : 'left'); return; }

          if (mod && e.key.toLowerCase() === 'a') {
            const cards = this.cards();
            if (!cards.length) return;
            e.preventDefault();
            cards.forEach(c => AppState.selectedIds.add(c.getAttribute('data-id')));
            renderApp();
            return;
          }

          const card = el && el.closest ? el.closest('#bookmarks-grid .bookmark-card') : null;
          if (!card) return;
          const id = card.getAttribute('data-id');
          const k = e.key.toLowerCase();

          if (e.key === 'Enter' && el === card) { e.preventDefault(); this.openCard(card, mod); return; }
          if (mod || e.altKey) return;

          if (e.key === ' ' || k === 'x') {
            e.preventDefault();
            if (AppState.selectedIds.has(id)) AppState.selectedIds.delete(id); else AppState.selectedIds.add(id);
            renderApp();
            return;
          }
          if (k === 'e') { e.preventDefault(); this.press(card, '[data-action="edit-bookmark"]'); return; }
          if (k === 'i') {
            e.preventDefault();
            const bm = AppState.data.bookmarks.find(b => b.id === id);
            if (bm && bm.description) NotesPopover.toggle(card.querySelector('[data-action="show-notes"]') || card, bm);
            else showToast('No notes on this bookmark', 'info');
            return;
          }
          if (k === 'f') { e.preventDefault(); this.press(card, '[data-action="toggle-star"]'); return; }
          if (k === 'y') { e.preventDefault(); this.press(card, '[data-action="toggle-archive"]'); return; }
          if (k === 'c') { e.preventDefault(); this.press(card, '[data-action="copy-title-link"]'); return; }
          if (k === 'r' && AppState.activeCategory === 'trash') { e.preventDefault(); this.press(card, '[data-action="restore-bookmark"]'); return; }
          if (k === 'm') {
            e.preventDefault();
            if (!AppState.selectedIds.size) AppState.selectedIds.add(id);
            openBatchMoveModal();
            return;
          }
          if (e.key === 'Delete' || e.key === 'Backspace') {
            e.preventDefault();
            const next = this.neighbour(card, 'right') !== card ? this.neighbour(card, 'right') : this.neighbour(card, 'left');
            const nextId = next && next !== card ? next.getAttribute('data-id') : null;
            this.press(card, '[data-action="delete-bookmark"]');
            AppState.focusedId = nextId;
            this.restore();
            return;
          }
          if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) {
            e.preventDefault();
            const r = card.getBoundingClientRect();
            const bm = AppState.data.bookmarks.find(b => b.id === id);
            if (bm) showBookmarkContextMenu({ clientX: r.left + 24, clientY: r.top + 40, preventDefault() {}, stopPropagation() {} }, bm);
          }
        },
      };

      window.addEventListener('keydown', (e) => KeyNav.onKeyDown(e));

      // Mouse use ends keyboard mode; clicking a card makes it the keyboard anchor
      document.addEventListener('mousedown', (e) => {
        KeyNav.active = false;
        const card = e.target.closest && e.target.closest('#bookmarks-grid .bookmark-card');
        if (card) AppState.focusedId = card.getAttribute('data-id');
      }, true);

      /* ===== src/js/99-bootstrap.js ===== */
      /* --------------------------------------------------------------------------
         13. INITIAL BOOTSTRAP
         -------------------------------------------------------------------------- */
      AppState.subscribe(renderApp);
      renderApp();

      console.log('ProMarker initialized successfully. Standalone single-page quine hub.');
    })();
  </script>
</body></html>
