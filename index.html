      /* ===== src/js/11-utils-toast.js ===== */
      /* --------------------------------------------------------------------------
         6. UTILITIES
         -------------------------------------------------------------------------- */
      function escapeHTML(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message, type = 'info', action = null) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';

        let actionBtnHtml = '';
        if (action && action.label && typeof action.onClick === 'function') {
          actionBtnHtml = `<button class="toast-action-btn" type="button">${escapeHTML(action.label)}</button>`;
        }

        const kind = type === 'success' ? 'success' : (type === 'danger' ? 'danger' : 'info');
        const iconType = kind === 'success' ? 'check' : (kind === 'danger' ? 'trash' : 'bookmark');
        toast.className = 'toast toast-' + kind;

        toast.innerHTML = `
          <span class="toast-icon"><svg class="icon icon-sm"><use href="#icon-${iconType}"/></svg></span>
          <span class="toast-msg">${escapeHTML(message)}</span>
          ${actionBtnHtml}
        `;

        if (action && action.onClick) {
          const btn = toast.querySelector('.toast-action-btn');
          if (btn) {
            btn.onclick = (e) => {
              e.stopPropagation();
              action.onClick();
              if (toast.parentNode) toast.parentNode.removeChild(toast);
            };
          }
        }

        container.appendChild(toast);
        const duration = action ? 5000 : 2800;
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(10px)';
          toast.style.transition = 'all 200ms ease';
          setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
          }, 200);
        }, duration);
      }

      /* ===== src/js/11a-confirm.js ===== */
      /* --------------------------------------------------------------------------
         6a. CONFIRM DIALOG (styled replacement for window.confirm)
         confirmDialog({ title, message, confirmLabel, cancelLabel, danger }) → Promise<boolean>
         Several choices: confirmDialog({ title, message, buttons: [{ label, value, kind }], dismissValue })
         resolves with the chosen button's value; Esc / clicking outside gives dismissValue.
         Lives in its own layer above other dialogs, so it can open on top of Settings.
         -------------------------------------------------------------------------- */
      const ConfirmDialog = {
        el: null,
        resolve: null,
        prevFocus: null,

        open(opts) {
          if (this.el) this.close(this.dismissValue);
          const o = Object.assign({ title: 'Are you sure?', message: '', confirmLabel: 'Confirm', cancelLabel: 'Cancel', danger: false, icon: null, buttons: null, dismissValue: false }, opts || {});
          const icon = o.icon || (o.danger ? 'trash' : 'shield');
          const buttons = o.buttons || [
            { label: o.cancelLabel, value: false, kind: 'secondary', focus: o.danger },
            { label: o.confirmLabel, value: true, kind: o.danger ? 'danger' : 'primary', focus: !o.danger },
          ];
          if (!buttons.some(b => b.focus)) buttons[buttons.length - 1].focus = true;
          this.values = buttons.map(b => b.value);
          this.dismissValue = o.dismissValue;
          this.prevFocus = document.activeElement;

          const root = document.createElement('div');
          root.className = 'modal-overlay active confirm-overlay';
          root.innerHTML = `
            <div class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
              <div class="confirm-body">
                <div class="confirm-icon ${o.danger ? 'danger' : ''}"><svg class="icon"><use href="#icon-${escapeHTML(icon)}"/></svg></div>
                <div class="confirm-text">
                  <h3 class="modal-title" id="confirm-title">${escapeHTML(o.title)}</h3>
                  ${o.message ? `<p class="confirm-message" id="confirm-message">${escapeHTML(o.message)}</p>` : ''}
                </div>
              </div>
              <div class="modal-footer">
                ${buttons.map((b, i) => `<button class="btn btn-${b.kind || 'secondary'}" type="button" data-confirm="${i}">${escapeHTML(b.label)}</button>`).join('')}
              </div>
            </div>`;
          root.addEventListener('mousedown', (e) => { if (e.target === root) this.close(this.dismissValue); });
          root.addEventListener('click', (e) => {
            const b = e.target.closest('[data-confirm]');
            if (b) this.close(this.values[Number(b.getAttribute('data-confirm'))]);
          });
          document.body.appendChild(root);
          this.el = root;
          // Default focus on Cancel for destructive actions, so Enter never deletes by accident
          root.querySelector(`[data-confirm="${buttons.findIndex(b => b.focus)}"]`).focus();
          return new Promise((resolve) => { this.resolve = resolve; });
        },

        close(result) {
          if (!this.el) return;
          this.el.remove();
          this.el = null;
          const r = this.resolve;
          this.resolve = null;
          if (this.prevFocus && document.contains(this.prevFocus) && this.prevFocus.focus) this.prevFocus.focus();
          if (r) r(result);
        },
      };

      function confirmDialog(opts) { return ConfirmDialog.open(opts); }

      // While the dialog is open it owns the keyboard: Esc cancels, Tab stays inside,
      // and app shortcuts (N, arrows, Cmd+Z …) don't reach the page underneath.
      window.addEventListener('keydown', (e) => {
        if (!ConfirmDialog.el) return;
        if (e.key === 'Escape') { e.preventDefault(); ConfirmDialog.close(ConfirmDialog.dismissValue); }
        else if (e.key === 'Tab') {
          const btns = [...ConfirmDialog.el.querySelectorAll('button')];
          const i = btns.indexOf(document.activeElement);
          e.preventDefault();
          btns[(i + (e.shiftKey ? btns.length - 1 : 1)) % btns.length].focus();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          const btns = [...ConfirmDialog.el.querySelectorAll('button')];
          const i = btns.indexOf(document.activeElement);
          btns[Math.max(0, Math.min(btns.length - 1, i + (e.key === 'ArrowLeft' ? -1 : 1)))].focus();
          e.preventDefault();
        }
        e.stopImmediatePropagation();
      }, true);

      /* ===== src/js/12-render-app.js ===== */
      /* --------------------------------------------------------------------------
         7. VIEW RENDERER (App Shell, Sidebar, Bookmark Cards, Modals)
         -------------------------------------------------------------------------- */
      function getSaveStatus() {
        const fh = AppState.fileHandle;
        const canLink = !!(window.showOpenFilePicker || window.showSaveFilePicker);
        const time = AppState.lastSavedTime ? AppState.lastSavedTime.replace(/:\d\d(\s|$)/, '$1').trim() : '';
        const s = { dot: '', text: '', title: '', btnLabel: 'Save', btnIcon: 'save', btnClass: '', btnTitle: 'Save now (Cmd/Ctrl+S)' };
        if (fh) {
          const paused = AppState.writePermission === 'prompt' || AppState.writePermission === 'denied';
          if (AppState.integrity) {
            s.dot = 'alert'; s.text = 'Saving paused · file changed';
            s.btnLabel = 'Review'; s.btnIcon = 'shield'; s.btnClass = 'btn-danger';
            s.btnTitle = 'The linked file was changed outside ProMarker';
          }
          else if (AppState.codeUpdated) {
            s.dot = 'paused'; s.text = 'Newer version on disk';
            s.btnLabel = 'Reload'; s.btnIcon = 'refresh'; s.btnClass = 'btn-warn';
            s.btnTitle = 'This file was updated to a newer ProMarker. Reload to continue; your edits come back.';
          }
          else if (AppState.isSaving) { s.dot = 'saving'; s.text = 'Saving…'; }
          else if (paused) {
            s.dot = 'paused'; s.text = AppState.isDirty ? 'Autosave paused · unsaved' : 'Autosave paused';
            s.btnLabel = 'Resume'; s.btnIcon = 'refresh'; s.btnClass = 'btn-warn';
            s.btnTitle = 'The browser needs your OK to write to ' + fh.name + ' again';
          }
          else if (AppState.isDirty) { s.dot = 'dirty'; s.text = 'Unsaved changes'; }
          else { s.text = time ? ('Saved · ' + time) : 'Saved'; }
          s.title = 'Linked to ' + fh.name + (AppState.data.settings.autoSave !== false ? ' — autosave on' : ' — autosave off');
        } else {
          const copyIsCurrent = AppState.isDirty && AppState.downloadedRevision === AppState.revision;
          s.dot = copyIsCurrent ? 'unlinked' : (AppState.isDirty ? 'dirty' : 'unlinked');
          s.text = copyIsCurrent ? 'Copy downloaded' : (AppState.isDirty ? 'Only in this browser' : 'Not linked to file');
          s.title = canLink
            ? 'Changes are kept in this browser only. Link the HTML file to save into it automatically.'
            : `${FileSupport.browserName()} can't write to files, so saving downloads an updated copy. Your edits stay in this browser meanwhile.`;
          s.btnLabel = canLink ? 'Link File' : 'Download';
          s.btnIcon = canLink ? 'link-file' : 'download';
          s.btnTitle = canLink ? 'Link this HTML file to enable autosave' : 'Download an updated copy (Cmd/Ctrl+S)';
        }
        return s;
      }

      const RECENT_LIMIT = 30;
      const recentTime = (b) => Math.max(b.lastVisitedAt || 0, b.updatedAt || 0, b.createdAt || 0);

      function renderApp() {
        const app = document.getElementById('app');
        if (!app) return;

        // The whole shell is re-rendered; remember which field had focus (e.g. search) so a
        // background save or sync never interrupts typing.
        const prevFocus = document.activeElement;
        const keepFocus = prevFocus && prevFocus.id && app.contains(prevFocus) &&
          ['INPUT', 'TEXTAREA', 'SELECT'].includes(prevFocus.tagName)
          ? { id: prevFocus.id, start: prevFocus.selectionStart, end: prevFocus.selectionEnd } : null;

        const { categories, bookmarks, settings } = AppState.data;
        const activeCat = AppState.activeCategory;
        const catTree = getCategoryTree(categories);

        // Calculate counts (Archive items are excluded from All Bookmarks and active views)
        const allCount = bookmarks.filter(b => !b.isTrash && !b.isArchived).length;
        const favCount = bookmarks.filter(b => b.isFavorite && !b.isTrash && !b.isArchived).length;
        const recentCount = Math.min(RECENT_LIMIT, allCount);
        const archiveCount = bookmarks.filter(b => b.isArchived && !b.isTrash).length;
        const saveStatus = getSaveStatus();
        const trashCount = bookmarks.filter(b => b.isTrash).length;

        // If viewing a specific category, include bookmarks in its descendant sub-category folders
        const isSpecialView = ['all', 'favorites', 'recent', 'archive', 'trash'].includes(activeCat);
        const activeCatDescendants = !isSpecialView ? getCategoryDescendants(activeCat, categories) : null;
        const isSearching = !!AppState.searchQuery.trim();

        // Filter bookmarks for current view (archived links are included whenever searching)
        let filtered = bookmarks.filter(b => {
          if (activeCat === 'trash') return b.isTrash;
          if (b.isTrash) return false;
          if (activeCat === 'archive') return b.isArchived === true;
          if (b.isArchived && !isSearching) return false;
          if (activeCat === 'all') return true;
          if (activeCat === 'favorites') return b.isFavorite;
          if (activeCat === 'recent') return true;
          return activeCatDescendants ? activeCatDescendants.has(b.categoryId) : b.categoryId === activeCat;
        });

        // Recent = latest activity, capped, before anything else narrows it
        if (activeCat === 'recent') {
          filtered = filtered.sort((a, b) => recentTime(b) - recentTime(a)).slice(0, RECENT_LIMIT);
        }

        // Tags offered in the chip bar: only those used by bookmarks in this view/category
        const allTags = Array.from(new Set(filtered.flatMap(b => b.tags || []))).sort();
        if (AppState.activeTag && !allTags.includes(AppState.activeTag)) AppState.activeTag = null;

        // Search: words must all match; "#tag" words match tags (prefix while typing)

      /* --------------------------------------------------------------------------

      function renderBookmarkCard(b, categories, settings) {
        const domain = extractDomain(b.url);
        const favicon = b.favicon || getFaviconUrl(b.url);
        const category = categories.find(c => c.id === b.categoryId);
        const catPath = category ? getCategoryPathString(category.id, categories) : '';
        const initial = domain ? domain.charAt(0).toUpperCase() : '?';
        const initialBg = getDomainColor(domain);
        const isSelected = AppState.selectedIds.has(b.id);

        return `
          <div
            class="bookmark-card ${isSelected ? 'selected' : ''}"
            style="--site: ${initialBg};"
            data-id="${b.id}"
            tabindex="-1"
            role="listitem"
            aria-selected="${isSelected}"
            aria-label="${escapeHTML(b.title || domain || b.url)}"
            draggable="true"
          >
            <span class="card-select-badge" aria-hidden="true"><svg class="icon"><use href="#icon-check"/></svg></span>
            <div class="card-top">
              <div class="favicon-wrap">
                <img
                  ${favicon ? `src="${escapeHTML(favicon)}"` : 'style="display: none;"'}
                  alt=""
                  class="favicon-img"
                  loading="lazy"
                  referrerpolicy="no-referrer"
                />
                <div class="favicon-fallback" style="display: ${favicon ? 'none' : 'flex'}; background: ${initialBg};">
                  ${escapeHTML(initial)}
                </div>
              </div>

      function renderSectionsView(filtered, categories, settings, activeCat, intro) {
        const isSpecial = ['all', 'favorites', 'recent', 'archive', 'trash'].includes(activeCat);
        const hasFilter = !!(AppState.searchQuery.trim() || AppState.activeTag);
        const activeDescendants = !isSpecial ? getCategoryDescendants(activeCat, categories) : null;

        // Group filtered bookmarks by their categoryId
        const byCat = new Map();
        const uncategorized = [];
        const validCatIds = new Set(categories.map(c => c.id));
        filtered.forEach(b => {
          if (b.categoryId && validCatIds.has(b.categoryId)) {
            if (!byCat.has(b.categoryId)) byCat.set(b.categoryId, []);
            byCat.get(b.categoryId).push(b);
          } else {
            uncategorized.push(b);
          }
        });

        // Determine which category & sub-category sections to show (in custom category order)
        const sections = [];
        categories.forEach(cat => {
          if (!isSpecial && activeDescendants && !activeDescendants.has(cat.id)) return;
          const items = byCat.get(cat.id) || [];
          const isParentFolder = categories.some(c => c.parentId === cat.id);
          // Parent folders without any direct links are not shown in All Bookmarks (or when subfolders exist)
          if (isParentFolder && items.length === 0) return;
          const showEmpty = !hasFilter && (activeCat === 'all' || !isSpecial);
          if (items.length > 0 || showEmpty) {
            sections.push({ cat, items });
          }
        });

        if (uncategorized.length > 0) {
          sections.push({
            cat: { id: '', name: 'Uncategorized', icon: 'folder', color: '#64748b' },
            items: uncategorized,
            isUncategorized: true
          });
        }

        return `
          <div class="bookmarks-sections${intro ? ' intro' : ''}" id="bookmarks-grid" role="region" aria-label="Bookmark Category Sections">
            ${sections.map(({ cat, items, isUncategorized }) => {
              return `
                <section class="category-section-card"
                         style="--cat: ${cat.color || 'var(--primary)'};"
                         ${cat.id ? `data-section-cat-id="${cat.id}" draggable="true"` : ''}>
                  <header class="section-card-header">
                    <div class="section-header-left" ${cat.id ? `data-cat-jump="${cat.id}" role="button" tabindex="0" title="Open ${escapeHTML(getCategoryPathString(cat.id, categories))}"` : ''}>
                      <span class="section-cat-icon">
                        <svg class="icon"><use href="#icon-${cat.icon || 'folder'}"/></svg>
                      </span>
                      <div class="section-title-wrap">
                        <h2 class="section-cat-title">${escapeHTML(cat.name)}</h2>
                      </div>
                    </div>
                    <div class="section-header-right">
                      <span class="section-count">${items.length}</span>
                      ${!isUncategorized && activeCat !== 'trash' ? `
                        <button type="button" class="action-btn section-head-btn" data-action="add-to-category" data-cat-id="${cat.id}" title="Add bookmark to ${escapeHTML(cat.name)}">
                          <svg class="icon icon-sm"><use href="#icon-plus"/></svg>
                        </button>
                        <button type="button" class="action-btn section-head-btn" data-action="add-subcategory" data-cat-id="${cat.id}" title="New subfolder in ${escapeHTML(cat.name)}">
                          <svg class="icon icon-sm"><use href="#icon-folder-plus"/></svg>
                        </button>
                        <button type="button" class="action-btn section-head-btn" data-action="edit-category" data-cat-id="${cat.id}" title="Edit ${escapeHTML(cat.name)}">
                          <svg class="icon icon-sm"><use href="#icon-edit"/></svg>
                        </button>
                        <span class="drag-handle section-head-btn section-drag-handle" title="Drag to reorder section">
                          <svg class="icon icon-sm"><use href="#icon-grip"/></svg>
                        </span>
                      ` : ''}
                    </div>
                  </header>

                  <div class="section-card-body" role="list" aria-label="${escapeHTML(cat.name)} bookmarks">
                    ${items.length === 0 ? `
                      <div class="section-empty">
                        <span>No links in this section yet</span>
                        ${!isUncategorized && activeCat !== 'trash' ? `
                          <button type="button" class="section-empty-add" data-action="add-to-category" data-cat-id="${cat.id}">
                            <svg class="icon icon-sm"><use href="#icon-plus"/></svg>
                            Add Link
                          </button>
                        ` : ''}
                      </div>
                    ` : items.map(b => renderSectionBookmarkItem(b, settings)).join('')}
                  </div>
                </section>
              `;
            }).join('')}
          </div>
        `;
      }

      /* ===== src/js/13a-notes-popover.js ===== */
      /* --------------------------------------------------------------------------
         8B. NOTES POPOVER
         Cards show a notes icon instead of the note text; clicking it (or pressing I
         on a focused card) opens this small panel next to the icon.
         -------------------------------------------------------------------------- */
      const NotesPopover = {
        el: null,
        forId: null,
        anchor: null,

        toggle(anchor, bm) {
          if (this.el && this.forId === bm.id) { this.hide(); return; }
          this.show(anchor, bm);
        },

        show(anchor, bm) {
          this.hide();
          const el = document.createElement('div');
          el.className = 'notes-popover';
          el.setAttribute('role', 'dialog');
          el.setAttribute('aria-label', 'Notes for ' + (bm.title || bm.url));
          el.innerHTML = `
            <div class="notes-popover-head">
              <svg class="icon icon-sm"><use href="#icon-note"/></svg>
              <span class="notes-popover-title">${escapeHTML(bm.title || extractDomain(bm.url) || 'Notes')}</span>
              <button class="action-btn" data-np="close" title="Close (Esc)" aria-label="Close"><svg class="icon icon-sm"><use href="#icon-x"/></svg></button>
            </div>
            <div class="notes-popover-body" tabindex="0">${escapeHTML(bm.description)}</div>
            <div class="notes-popover-foot">
              <button class="btn btn-secondary" data-np="copy"><svg class="icon icon-sm"><use href="#icon-copy"/></svg>Copy</button>
              ${bm.isTrash ? '' : '<button class="btn btn-secondary" data-np="edit"><svg class="icon icon-sm"><use href="#icon-edit"/></svg>Edit</button>'}
            </div>`;
          document.body.appendChild(el);
          this.el = el;
          this.forId = bm.id;
          this.anchor = anchor;
          if (anchor) anchor.setAttribute('aria-expanded', 'true');
          this.position();

          el.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-np]');
            if (!btn) return;
            const action = btn.getAttribute('data-np');
            if (action === 'close') this.hide(true);
            if (action === 'copy') {
              try { await navigator.clipboard.writeText(bm.description || ''); showToast('Notes copied', 'success'); }
              catch (err) { showToast('Could not copy notes', 'danger'); }
            }
            if (action === 'edit') { this.hide(); openBookmarkModal(bm); }
          });
          el.querySelector('.notes-popover-body').focus({ preventScroll: true });
        },

        // Below the icon, right-aligned to it; flips above / clamps to stay on screen
        position() {
          if (!this.el || !this.anchor || !this.anchor.isConnected) return;
          const r = this.anchor.getBoundingClientRect();
          const w = this.el.offsetWidth, h = this.el.offsetHeight, m = 10;
          let left = Math.min(Math.max(m, r.right - w), window.innerWidth - w - m);
          let top = r.bottom + 6;
          if (top + h > window.innerHeight - m) top = Math.max(m, r.top - h - 6);
          this.el.style.left = left + 'px';
          this.el.style.top = top + 'px';
        },

        hide(refocus) {
          if (!this.el) return;
          this.el.remove();
          this.el = null;
          const id = this.forId;
          this.forId = null;
          if (this.anchor) this.anchor.setAttribute('aria-expanded', 'false');
          this.anchor = null;
          if (refocus) {
            const card = KeyNav.cardById(id);
            if (card) KeyNav.focus(card, { scroll: false });
          }
        },
      };

      // Close on outside click, scroll or resize
      document.addEventListener('mousedown', (e) => {
        if (!NotesPopover.el) return;
        if (NotesPopover.el.contains(e.target) || e.target.closest('[data-action="show-notes"]')) return;
        NotesPopover.hide();
      }, true);
      window.addEventListener('resize', () => NotesPopover.hide());
      document.addEventListener('scroll', (e) => {
        if (NotesPopover.el && !NotesPopover.el.contains(e.target)) NotesPopover.hide();
      }, true);

      /* --------------------------------------------------------------------------

         -------------------------------------------------------------------------- */
      function bindAppEvents() {
        // Sidebar Toggle
        const collapseBtn = document.getElementById('btn-collapse-sidebar');
        if (collapseBtn) {
          collapseBtn.onclick = () => {
            AppState.sidebarCollapsed = true;
            renderApp();
          };
        }
        const expandBtn = document.getElementById('btn-expand-sidebar');
        if (expandBtn) {
          expandBtn.onclick = () => {
            AppState.sidebarCollapsed = false;
            renderApp();
          };
        }

        const scrim = document.getElementById('sidebar-scrim');
        if (scrim) scrim.onclick = () => { AppState.sidebarCollapsed = true; renderApp(); };

        // Search Input
        const searchInput = document.getElementById('global-search');
        if (searchInput) {
          searchInput.oninput = (e) => {
            AppState.searchQuery = e.target.value;
            renderApp(); // renderApp keeps focus and cursor position in the search box
          };
        }
        const searchClear = document.getElementById('btn-search-clear');
        if (searchClear) {
          searchClear.onmousedown = (e) => e.preventDefault(); // keep focus in the box
          searchClear.onclick = () => {
            AppState.searchQuery = '';
            renderApp();
            const box = document.getElementById('global-search');
            if (box) box.focus();
          };
        }

        // View Mode Switcher
        document.querySelectorAll('.segment-btn[data-view]').forEach(btn => {
          btn.onclick = () => {
            AppState.data.settings.viewMode = btn.getAttribute('data-view');
            AppState.saveDirty();
            renderApp();
          };
        });

        // Sort By Select
        const sortSelect = document.getElementById('sort-select');
        if (sortSelect) {
          sortSelect.onchange = (e) => {
            AppState.data.settings.sortBy = e.target.value;
            AppState.saveDirty();
            renderApp();
          };
        }

        // Navigation clicks
        document.querySelectorAll('.nav-item[data-nav]').forEach(item => {
          item.onclick = () => {
            AppState.activeCategory = item.getAttribute('data-nav');
            AppState.activeTag = null;
            AppState.selectedIds.clear();
            if (AppState.isNarrow()) AppState.sidebarCollapsed = true;
            renderApp();
          };
        });

        document.querySelectorAll('.nav-item[data-cat-id]').forEach(item => {
          item.onclick = (e) => {
            const toggleBtn = e.target.closest('[data-toggle-cat]');
            if (toggleBtn) {
              e.stopPropagation();
              const cid = toggleBtn.getAttribute('data-toggle-cat');
              if (AppState.collapsedCats.has(cid)) AppState.collapsedCats.delete(cid);
              else AppState.collapsedCats.add(cid);
              renderApp();
              return;
            }
            const addSubBtn = e.target.closest('[data-add-subcat]');
            if (addSubBtn) {
              e.stopPropagation();
              openCategoryModal(null, addSubBtn.getAttribute('data-add-subcat'));
              return;
            }
            AppState.activeCategory = item.getAttribute('data-cat-id');
            AppState.activeTag = null;
            AppState.selectedIds.clear();
            if (AppState.isNarrow()) AppState.sidebarCollapsed = true;
            renderApp();
          };
        });

        // Category jump links (breadcrumbs, subcategory pills, section headers)
        document.querySelectorAll('[data-cat-jump]').forEach(el => {
          el.onclick = (e) => {
            e.stopPropagation();
            const cid = el.getAttribute('data-cat-jump');
            if (!cid) return;
            AppState.activeCategory = cid;
            AppState.activeTag = null;
            AppState.selectedIds.clear();
            renderApp();
          };
        });

        // Tag Chip clicks
        document.querySelectorAll('.tag-chip[data-filter-tag]').forEach(chip => {
          chip.onclick = () => {
            const tag = chip.getAttribute('data-filter-tag');
            AppState.activeTag = tag ? tag : null;
            renderApp();
          };
        });

        // Undo & Redo Buttons
        const undoBtn = document.getElementById('btn-undo');
        if (undoBtn) undoBtn.onclick = () => HistoryManager.undo();
        const redoBtn = document.getElementById('btn-redo');
        if (redoBtn) redoBtn.onclick = () => HistoryManager.redo();

        // Save File Button
        const saveBtn = document.getElementById('btn-save-file');
        if (saveBtn) {
          saveBtn.onclick = () => {
            if (AppState.integrity) { openIntegrityModal(); return; }
            if (AppState.codeUpdated) { location.reload(); return; }
            if (!AppState.fileHandle && window.showOpenFilePicker) {
              QuineEngine.connectFile();
            } else {
              QuineEngine.save();
            }
          };
        }

        // Link Current File Banner Button
        const fileHelpBtn = document.getElementById('btn-file-help');
        if (fileHelpBtn) fileHelpBtn.onclick = () => openFileHelpModal();
        const fileHelpDismiss = document.getElementById('btn-file-help-dismiss');
        if (fileHelpDismiss) fileHelpDismiss.onclick = () => { FileSupport.hideTip(); renderApp(); };

        const bannerLinkBtn = document.getElementById('btn-banner-link');
        if (bannerLinkBtn) {
          bannerLinkBtn.onclick = () => QuineEngine.connectFile();
        }

        // New Bookmark Buttons
        const newBtn = document.getElementById('btn-new-bookmark');
        if (newBtn) newBtn.onclick = () => openBookmarkModal();
        const emptyAdd = document.getElementById('btn-empty-add');
        if (emptyAdd) emptyAdd.onclick = () => openBookmarkModal();

        // New Category Button
        const addCatBtn = document.getElementById('btn-add-category');
        if (addCatBtn) addCatBtn.onclick = () => openCategoryModal();

        // New Subcategory Button (in Category Heading)
        const addSubCatBtn = document.getElementById('btn-add-subcategory');
        if (addSubCatBtn) {
          addSubCatBtn.onclick = () => openCategoryModal(null, AppState.activeCategory);
        }

        // Edit Current Category Button
        const editCatBtn = document.getElementById('btn-edit-current-category');
        if (editCatBtn) {
          editCatBtn.onclick = () => {
            const cat = AppState.data.categories.find(c => c.id === AppState.activeCategory);
            if (cat) openCategoryModal(cat);
          };
        }

        // Unarchive All Button
        const unarchiveAllBtn = document.getElementById('btn-unarchive-all');
        if (unarchiveAllBtn) {
          unarchiveAllBtn.onclick = () => {
            const archivedItems = AppState.data.bookmarks.filter(b => b.isArchived && !b.isTrash);
            if (archivedItems.length === 0) return;
            AppState.recordAction('Unarchive All');
            archivedItems.forEach(b => { b.isArchived = false; });
            AppState.saveDirty();
            showToast(`Unarchived ${archivedItems.length} ${archivedItems.length === 1 ? 'link' : 'links'}`, 'success', {
              label: 'Undo',
              onClick: () => HistoryManager.undo()
            });
            renderApp();
          };
        }

        // Empty Trash Button
        const emptyTrashBtn = document.getElementById('btn-empty-trash');
        if (emptyTrashBtn) {
          emptyTrashBtn.onclick = async () => {
            const trashCount = AppState.data.bookmarks.filter(b => b.isTrash).length;
            if (trashCount === 0) return;
            if (await confirmDialog({ title: 'Empty Trash?', message: `${trashCount} ${trashCount === 1 ? 'link' : 'links'} will be deleted permanently. You can still undo right after.`, confirmLabel: 'Empty Trash', danger: true })) {
              AppState.recordAction('Empty Trash');
              AppState.data.bookmarks = AppState.data.bookmarks.filter(b => !b.isTrash);
              AppState.saveDirty();
              showToast('Trash emptied', 'info', {
                label: 'Undo',
                onClick: () => HistoryManager.undo()
              });
              renderApp();
            }
          };
        }

        // Restore All Button
        const restoreAllBtn = document.getElementById('btn-restore-all');
        if (restoreAllBtn) {
          restoreAllBtn.onclick = () => {
            const trashItems = AppState.data.bookmarks.filter(b => b.isTrash);
            if (trashItems.length === 0) return;
            AppState.recordAction('Restore All from Trash');
            trashItems.forEach(b => {
              b.isTrash = false;
              if (!AppState.data.categories.some(c => c.id === b.categoryId)) {

      /* ===== src/js/15-drag-drop.js ===== */
      /* --------------------------------------------------------------------------
         10. DRAG & DROP ENGINE (Card Reordering & Category Moving)
         -------------------------------------------------------------------------- */
      let draggedBookmarkId = null;

      function initDragAndDrop() {
        const cards = document.querySelectorAll('.bookmark-card');
        const catNavItems = document.querySelectorAll('.nav-item[data-cat-id], .nav-item[data-nav="trash"], .nav-item[data-nav="archive"], .nav-item[data-nav="favorites"], .nav-item[data-nav="all"]');
        const sectionCards = document.querySelectorAll('.category-section-card[data-section-cat-id]');

        cards.forEach(card => {
          card.ondragstart = (e) => {
            e.stopPropagation();
            draggedBookmarkId = card.getAttribute('data-id');
            card.classList.add('dragging');
            e.dataTransfer.setData('text/x-promarker-id', draggedBookmarkId);
            e.dataTransfer.setData('text/plain', card.querySelector('.card-title')?.href || '');
            e.dataTransfer.effectAllowed = 'move';
          };

          card.ondragend = () => {
            draggedBookmarkId = null;
            card.classList.remove('dragging');
            document.querySelectorAll('.bookmark-card').forEach(c => {
              c.classList.remove('drag-over-before', 'drag-over-after');
            });
            document.querySelectorAll('.nav-item, .category-section-card').forEach(n => n.classList.remove('drop-target-active'));
          };

          // Grid reordering (Custom Sort)
          card.ondragover = (e) => {
            if (!draggedBookmarkId || draggedBookmarkId === card.getAttribute('data-id')) return;
            if (AppState.data.settings.sortBy !== 'custom' && AppState.data.settings.viewMode !== 'sections') return;

            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const rect = card.getBoundingClientRect();
            const midpoint = rect.top + rect.height / 2;
            if (e.clientY < midpoint) {
              card.classList.add('drag-over-before');
              card.classList.remove('drag-over-after');
            } else {
              card.classList.add('drag-over-after');
              card.classList.remove('drag-over-before');
            }
          };

          card.ondragleave = () => {
            card.classList.remove('drag-over-before', 'drag-over-after');
          };

          card.ondrop = (e) => {
            if (!draggedBookmarkId || draggedBookmarkId === card.getAttribute('data-id')) return;
            if (AppState.data.settings.sortBy !== 'custom' && AppState.data.settings.viewMode !== 'sections') return;

            e.preventDefault();
            e.stopPropagation();
            const sourceId = draggedBookmarkId;
            draggedBookmarkId = null;
            const targetId = card.getAttribute('data-id');
            const isBefore = card.classList.contains('drag-over-before');
            const sec = card.closest('.category-section-card[data-section-cat-id]');
            const targetSectionCatId = sec ? sec.getAttribute('data-section-cat-id') : null;

            reorderBookmarks(sourceId, targetId, isBefore, targetSectionCatId);
          };
        });

        // Section card dropzones in Sections View (move bookmark into another category section)
        sectionCards.forEach(sec => {
          sec.ondragover = (e) => {
            if (!draggedBookmarkId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            sec.classList.add('drop-target-active');
          };

          sec.ondragleave = (e) => {
            if (!sec.contains(e.relatedTarget)) {
              sec.classList.remove('drop-target-active');
            }
          };

          sec.ondrop = (e) => {
            if (!draggedBookmarkId) return;
            e.preventDefault();
            sec.classList.remove('drop-target-active');
            const targetCatId = sec.getAttribute('data-section-cat-id');
            const bm = AppState.data.bookmarks.find(b => b.id === draggedBookmarkId);
            draggedBookmarkId = null;
            if (!bm || !targetCatId || bm.categoryId === targetCatId) return;
            const cat = AppState.data.categories.find(c => c.id === targetCatId);
            AppState.recordAction(`Move "${bm.title || 'Link'}" to ${cat ? cat.name : 'Category'}`);
            bm.categoryId = targetCatId;
            bm.isTrash = false;
            AppState.saveDirty();
            renderApp();
            showToast(`Moved to ${cat ? cat.name : 'Category'}`, 'success', {
              label: 'Undo',
              onClick: () => HistoryManager.undo()
            });
          };
        });

        // Sidebar dropzones (drop onto category, archive, favorites, all, or trash)
        catNavItems.forEach(item => {
          item.ondragover = (e) => {
            if (!draggedBookmarkId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            item.classList.add('drop-target-active');
          };

          item.ondragleave = () => {
            item.classList.remove('drop-target-active');
          };

          item.ondrop = (e) => {
            if (!draggedBookmarkId) return;
            e.preventDefault();
            item.classList.remove('drop-target-active');

            const targetCatId = item.getAttribute('data-cat-id');
            const targetNav = item.getAttribute('data-nav');
            const bm = AppState.data.bookmarks.find(b => b.id === draggedBookmarkId);
            draggedBookmarkId = null;

            if (!bm) return;

            if (targetNav === 'trash') {
              AppState.recordAction(`Move "${bm.title || 'Link'}" to Trash`);
              bm.isTrash = true;
              showToast(`Moved "${bm.title || 'Link'}" to Trash`, 'info', {
                label: 'Undo',
                onClick: () => HistoryManager.undo()
              });
            } else if (targetNav === 'archive') {
              AppState.recordAction(`Archive "${bm.title || 'Link'}"`);
              bm.isArchived = true;
              bm.isTrash = false;
              showToast(`Archived "${bm.title || 'Link'}"`, 'info', {
                label: 'Undo',
                onClick: () => HistoryManager.undo()
              });
            } else if (targetNav === 'all') {
              AppState.recordAction(`Restore "${bm.title || 'Link'}" to All Bookmarks`);
              bm.isArchived = false;
              bm.isTrash = false;
              showToast(`Moved "${bm.title || 'Link'}" to All Bookmarks`, 'success', {
                label: 'Undo',
                onClick: () => HistoryManager.undo()
              });
            } else if (targetNav === 'favorites') {
              AppState.recordAction(`Favorite "${bm.title || 'Link'}"`);
              bm.isFavorite = true;
              bm.isArchived = false;
              bm.isTrash = false;
              showToast(`Added "${bm.title || 'Link'}" to Favorites`, 'success', {
                label: 'Undo',
                onClick: () => HistoryManager.undo()
              });
            } else if (targetCatId) {
              const cat = AppState.data.categories.find(c => c.id === targetCatId);
              AppState.recordAction(`Move "${bm.title || 'Link'}" to ${cat ? cat.name : 'Category'}`);
              bm.categoryId = targetCatId;
              bm.isTrash = false;
              bm.isArchived = false;
              showToast(`Moved to ${cat ? cat.name : 'Category'}`, 'success', {
                label: 'Undo',
                onClick: () => HistoryManager.undo()
              });
            }

            AppState.saveDirty();
            renderApp();
          };
        });

        // Category reordering in the sidebar (15a-category-order.js)
        initCategoryDrag();

        // External link drop support (drop URL anywhere onto content-area)
        const contentArea = document.getElementById('content-drop-area');
        if (contentArea) {
          contentArea.ondragover = (e) => {
            if (!draggedBookmarkId && !draggedCategoryId) {
              e.preventDefault();
              e.dataTransfer.dropEffect = 'copy';
            }
          };

          contentArea.ondrop = (e) => {
            if (draggedBookmarkId) return; // already handled by card
            e.preventDefault();
            const droppedText = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/uri-list');
            if (droppedText && (droppedText.startsWith('http://') || droppedText.startsWith('https://'))) {
              openBookmarkModal({ url: droppedText, title: extractDomain(droppedText) });
            }
          };
        }
      }

      function reorderBookmarks(sourceId, targetId, insertBefore, targetSectionCatId = null) {
        AppState.recordAction('Reorder Bookmarks');
        const list = AppState.data.bookmarks;
        const sourceIndex = list.findIndex(b => b.id === sourceId);
        const targetIndex = list.findIndex(b => b.id === targetId);

        if (sourceIndex === -1 || targetIndex === -1) return;

        const [removed] = list.splice(sourceIndex, 1);
        if (targetSectionCatId && removed.categoryId !== targetSectionCatId) {
          removed.categoryId = targetSectionCatId;
          removed.isTrash = false;
        }
        let newIndex = list.findIndex(b => b.id === targetId);
        if (!insertBefore) newIndex++;

        list.splice(newIndex, 0, removed);

        // Update sequential order numbers
        list.forEach((b, idx) => { b.order = idx; });

        AppState.saveDirty();
        renderApp();
      }

      /* ===== src/js/15a-category-order.js ===== */
      /* --------------------------------------------------------------------------
         10B. CATEGORY ORDER (sidebar)
         Drag a category up or down in the sidebar, or use Move Up / Move Down in its
         right-click menu. The order is saved into the file (and undoable); the
         1–9 shortcuts follow it.
         -------------------------------------------------------------------------- */
      let draggedCategoryId = null;

      function moveCategory(id, toIndex, newParentId = undefined) {
        const list = AppState.data.categories;
        const from = list.findIndex(c => c.id === id);
        if (from === -1) return;
        const cat = list[from];
        const desc = getCategoryDescendants(id, list);
        const canChangeParent = newParentId !== undefined && (!newParentId || !desc.has(newParentId));
        const parentChanged = canChangeParent && (cat.parentId || '') !== (newParentId || '');
        const target = Math.max(0, Math.min(list.length - 1, toIndex));
        if (target === from && !parentChanged) return;

        const parentCat = newParentId ? list.find(c => c.id === newParentId) : null;
        const actionLabel = parentChanged
          ? (newParentId ? `Move "${cat.name}" into "${parentCat ? parentCat.name : 'folder'}"` : `Move "${cat.name}" to top level`)
          : `Reorder category "${cat.name}"`;
        AppState.recordAction(actionLabel);

        if (canChangeParent) {
          cat.parentId = newParentId || '';
          if (newParentId) AppState.collapsedCats.delete(newParentId);
        }
        if (target !== from) {
          list.splice(from, 1);
          list.splice(target, 0, cat);
        }
        list.forEach((c, i) => { c.order = i; });
        AppState.saveDirty();
        renderApp();
        showToast(
          parentChanged
            ? (newParentId ? `Moved "${cat.name}" into "${parentCat ? parentCat.name : 'folder'}"` : `Moved "${cat.name}" to top level`)
            : `Moved "${cat.name}" to position ${target + 1}`,
          'success',
          { label: 'Undo', onClick: () => HistoryManager.undo() }
        );
      }

      function setCategoryParent(id, newParentId) {
        const list = AppState.data.categories;
        const idx = list.findIndex(c => c.id === id);
        if (idx === -1) return;
        moveCategory(id, idx, newParentId || '');
      }

      // Context-menu entries for a category (only the moves that make sense)
      function categoryMoveItems(cat) {
        const list = AppState.data.categories;
        const i = list.findIndex(c => c.id === cat.id);
        const items = [];
        if (cat.parentId) {
          items.push({
            label: 'Move Out to Top Level',
            icon: 'arrow-up',
            action: () => setCategoryParent(cat.id, '')
          });
        }
        const forbidden = getCategoryDescendants(cat.id, list);
        const validTargets = getCategoryTree(list).filter(({ cat: c }) => !forbidden.has(c.id) && c.id !== (cat.parentId || ''));
        if (validTargets.length > 0 || cat.parentId) {
          const submenu = [];
          if (cat.parentId) {
            submenu.push({
              label: 'Top-Level (No Parent)',
              icon: 'folder',
              color: 'var(--primary)',
              action: () => setCategoryParent(cat.id, '')
            });
          }
          validTargets.forEach(({ cat: c, depth }) => {
            submenu.push({
              label: (depth > 0 ? '  '.repeat(depth) + '↳ ' : '') + c.name,
              icon: c.icon || 'folder',
              color: c.color,
              action: () => setCategoryParent(cat.id, c.id)
            });
          });
          items.push({
            label: 'Move Folder Into...',
            icon: 'folder',
            submenu
          });
        }
        if (i > 0) items.push({ label: 'Move Up', icon: 'arrow-up', action: () => moveCategory(cat.id, i - 1) });
        if (i !== -1 && i < list.length - 1) items.push({ label: 'Move Down', icon: 'arrow-down', action: () => moveCategory(cat.id, i + 1) });
        if (i > 1) items.push({ label: 'Move to Top', icon: 'arrow-up', action: () => moveCategory(cat.id, 0) });
        return items;
      }

      function initCategoryDrag() {
        const items = Array.from(document.querySelectorAll('#category-nav-list .nav-item[data-cat-id]'));
        const sectionCards = Array.from(document.querySelectorAll('.category-section-card[data-section-cat-id]'));
        const catHeader = document.querySelector('#btn-add-category')?.closest('.sidebar-section-title');
        const clear = () => {
          items.forEach(el => el.classList.remove('cat-drop-before', 'cat-drop-after', 'cat-drop-inside', 'cat-dragging'));
          sectionCards.forEach(el => el.classList.remove('sec-drop-before', 'sec-drop-after', 'sec-dragging'));
          if (catHeader) catHeader.classList.remove('cat-drop-root');
        };

        items.forEach(item => {
          item.addEventListener('dragstart', (e) => {
            if (draggedBookmarkId) return;
            draggedCategoryId = item.getAttribute('data-cat-id');
            item.classList.add('cat-dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/x-promarker-category', draggedCategoryId);
          });

          item.addEventListener('dragend', () => { draggedCategoryId = null; clear(); });

          item.addEventListener('dragover', (e) => {
            const targetId = item.getAttribute('data-cat-id');
            if (!draggedCategoryId || draggedCategoryId === targetId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const r = item.getBoundingClientRect();
            const relY = (e.clientY - r.top) / Math.max(1, r.height);
            const desc = getCategoryDescendants(draggedCategoryId, AppState.data.categories);
            const canNestInside = !desc.has(targetId);

            item.classList.remove('cat-drop-before', 'cat-drop-after', 'cat-drop-inside');
            if (canNestInside && relY >= 0.25 && relY <= 0.75) {
              item.classList.add('cat-drop-inside');
            } else if (relY < 0.5) {
              item.classList.add('cat-drop-before');
            } else {
              item.classList.add('cat-drop-after');
            }
          });

          item.addEventListener('dragleave', () => item.classList.remove('cat-drop-before', 'cat-drop-after', 'cat-drop-inside'));

          item.addEventListener('drop', (e) => {
            if (!draggedCategoryId) return;
            e.preventDefault();
            e.stopPropagation();
            const list = AppState.data.categories;
            const targetId = item.getAttribute('data-cat-id');
            const isInside = item.classList.contains('cat-drop-inside');
            const before = item.classList.contains('cat-drop-before');
            const id = draggedCategoryId;
            draggedCategoryId = null;
            clear();
            if (id === targetId) return;

            const targetCat = list.find(c => c.id === targetId);
            const from = list.findIndex(c => c.id === id);
            if (isInside) {
              // Make dragged folder a subfolder of targetId
              let to = list.findIndex(c => c.id === targetId) + 1;
              if (from < to) to -= 1;
              moveCategory(id, to, targetId);
            } else {
              // Reorder before/after targetCat and adopt targetCat's parentId (moves out to top-level if targetCat is top-level)
              const r = item.getBoundingClientRect();
              const unnestToRoot = (e.clientX - r.left) < 20;
              const newParentId = unnestToRoot ? '' : (targetCat ? (targetCat.parentId || '') : '');
              let to = list.findIndex(c => c.id === targetId) + (before ? 0 : 1);
              if (from < to) to -= 1;
              moveCategory(id, to, newParentId);
            }
          });
        });

        // Dropping a subfolder onto the "Categories" sidebar header moves it out to top-level
        if (catHeader) {
          catHeader.addEventListener('dragover', (e) => {
            if (!draggedCategoryId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            catHeader.classList.add('cat-drop-root');
          });
          catHeader.addEventListener('dragleave', () => catHeader.classList.remove('cat-drop-root'));
          catHeader.addEventListener('drop', (e) => {
            if (!draggedCategoryId) return;
            e.preventDefault();
            const id = draggedCategoryId;
            draggedCategoryId = null;
            clear();
            setCategoryParent(id, '');
          });
        }

        // Drag-and-drop section reordering in Sections View
        sectionCards.forEach(sec => {
          sec.addEventListener('dragstart', (e) => {
            if (draggedBookmarkId || e.target.closest('.bookmark-card')) return;
            draggedCategoryId = sec.getAttribute('data-section-cat-id');
            sec.classList.add('sec-dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/x-promarker-category', draggedCategoryId);
          });

          sec.addEventListener('dragend', () => { draggedCategoryId = null; clear(); });

          sec.addEventListener('dragover', (e) => {
            if (!draggedCategoryId || draggedCategoryId === sec.getAttribute('data-section-cat-id')) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const r = sec.getBoundingClientRect();
            const before = e.clientX < r.left + r.width / 2;
            sec.classList.toggle('sec-drop-before', before);
            sec.classList.toggle('sec-drop-after', !before);
          });

          sec.addEventListener('dragleave', (e) => {
            if (!sec.contains(e.relatedTarget)) {
              sec.classList.remove('sec-drop-before', 'sec-drop-after');
            }
          });

          sec.addEventListener('drop', (e) => {
            if (!draggedCategoryId) return;
            e.preventDefault();
            e.stopPropagation();
            const list = AppState.data.categories;
            const targetId = sec.getAttribute('data-section-cat-id');
            const before = sec.classList.contains('sec-drop-before');
            const id = draggedCategoryId;
            draggedCategoryId = null;
            clear();
            if (id === targetId) return;
            const from = list.findIndex(c => c.id === id);
            let to = list.findIndex(c => c.id === targetId) + (before ? 0 : 1);
            if (from < to) to -= 1;
            moveCategory(id, to);
          });
        });
      }

      const MOD_KEY = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';

              </div>

              <div class="modal-body bm-body">
                <div class="form-group">
                  <label class="form-label" for="bm-url">Address</label>
                  <div class="input-affix">
                    <svg class="icon icon-sm input-affix-icon"><use href="#icon-globe"/></svg>
                    <input

                      class="form-input"
                      id="bm-url"
                      placeholder="https://example.com"
                      value="${escapeHTML(initialData.url)}"
                      autocomplete="off"
                      spellcheck="false"
                      required
                    />
                    <button type="button" class="input-affix-btn" id="bm-open-url" title="Open in a new tab" ${initialData.url ? '' : 'hidden'}>
                      <svg class="icon icon-sm"><use href="#icon-external-link"/></svg>
                    </button>
                  </div>
                  <div class="form-hint" id="bm-dup-hint" hidden></div>
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="bm-title">Title</label>
                    <input
                      type="text"
                      class="form-input"
                      id="bm-title"
                      placeholder="Page or app name"
                      value="${escapeHTML(initialData.title)}"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="bm-category">Category</label>
                    <select class="form-select" id="bm-category">
                      ${catTree.map(({ cat: c, depth }) => `<option value="${c.id}" data-depth="${depth}" ${c.id === initialData.categoryId ? 'selected' : ''}>${escapeHTML(getCategoryPathString(c.id, categories))}</option>`).join('')}
                    </select>

                <div class="form-group">
                  <label class="form-label" for="bm-tag-entry">Tags</label>

                    <input type="text" class="tag-field-input" id="bm-tag-entry" placeholder="Add a tag…" autocomplete="off" spellcheck="false"
                           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="bm-tag-suggest" />
                    <div class="tag-suggest" id="bm-tag-suggest" role="listbox" hidden></div>

                </div>

                <div class="form-group">
                  <label class="form-label" for="bm-desc">Notes <span class="form-label-hint">shown from the note icon on the card</span></label>
                  <textarea
                    class="form-textarea"

                    placeholder="Why you saved it, key takeaways, context… (avoid passwords — saved as plain text)"

              <div class="modal-footer">
                ${isEdit && !existing.isTrash ? `
                  <button class="btn btn-secondary btn-icon-only btn-danger-ghost" id="bm-trash" title="Move to Trash">
                    <svg class="icon icon-sm"><use href="#icon-trash"/></svg>
                  </button>` : ''}
                <span class="modal-footer-note">${meta ? escapeHTML(meta) : `<kbd class="kbd">${MOD_KEY}</kbd> <kbd class="kbd">↵</kbd> to save`}</span>
                <button class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>

          </div>
        `;

        const urlInput = document.getElementById('bm-url');
        const titleInput = document.getElementById('bm-title');
        enhanceCategorySelect(document.getElementById('bm-category'));
        urlInput.focus();

        // ---- Live preview: icon, title and domain follow what you type
        const heroIcon = document.getElementById('bm-hero-icon');
        const heroImg = document.getElementById('bm-hero-img');
        const heroFallback = document.getElementById('bm-hero-fallback');
        const heroTitle = document.getElementById('bm-hero-title');
        const heroDomain = document.getElementById('bm-hero-domain');
        const openBtn = document.getElementById('bm-open-url');
        let shownDomain = null;
        heroImg.addEventListener('load', () => { heroImg.hidden = false; heroFallback.hidden = true; });
        heroImg.addEventListener('error', () => { heroImg.hidden = true; heroFallback.hidden = false; });
        const paintPreview = () => {
          const raw = urlInput.value.trim();
          const domain = raw ? extractDomain(/^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw : 'https://' + raw) : '';
          heroTitle.textContent = titleInput.value.trim() || domain || 'Untitled link';
          heroDomain.textContent = domain || 'Paste an address to begin';
          openBtn.hidden = !raw;
          if (domain === shownDomain) return;
          shownDomain = domain;
          heroIcon.style.setProperty('--site', domain ? getDomainColor(domain) : 'var(--primary)');
          heroImg.hidden = true; heroFallback.hidden = false;
          const stored = existing && existing.favicon && normalizeUrlKey(existing.url) === normalizeUrlKey(raw) ? existing.favicon : '';
          const iconUrl = stored || (domain ? getFaviconUrl('https://' + domain) : '');
          if (iconUrl) {
            heroImg.src = iconUrl;
          } else heroImg.removeAttribute('src');
        };
        let previewTimer = null;
        urlInput.addEventListener('input', () => { clearTimeout(previewTimer); previewTimer = setTimeout(paintPreview, 250); });
        titleInput.addEventListener('input', paintPreview);
        paintPreview();
        openBtn.onclick = () => { if (urlInput.value.trim()) openSafely(urlInput.value.trim()); };

        // Auto-fill title from URL domain if title is empty
        urlInput.onblur = () => {
          if (!titleInput.value && urlInput.value) {
            titleInput.value = extractDomain(urlInput.value);
          }
          paintPreview();
        };

        // ---- Favorite star in the header drives the hidden checkbox
        const starBtn = document.getElementById('bm-star-btn');
        const favBox = document.getElementById('bm-favorite');
        starBtn.onclick = () => {
          favBox.checked = !favBox.checked;
          starBtn.classList.toggle('on', favBox.checked);
          starBtn.setAttribute('aria-pressed', String(favBox.checked));
          starBtn.title = favBox.checked ? 'Unfavorite' : 'Favorite';
        };

        // ---- Tag chips with suggestions from tags already in use (#bm-tags keeps the comma list)
        const tagsHidden = document.getElementById('bm-tags');
        const tagEntry = document.getElementById('bm-tag-entry');
        const chipsEl = document.getElementById('bm-tag-chips');
        const suggestEl = document.getElementById('bm-tag-suggest');
        const known = DataTools.tagCounts();
        const cleanTag = (t) => String(t || '').trim().toLowerCase().replace(/^#+/, '').replace(/,/g, '').slice(0, 60);
        let chosen = initialData.tags.split(',').map(cleanTag).filter(Boolean);
        let suggestions = [];
        let active = -1;
        const syncTags = () => {
          tagsHidden.value = chosen.join(', ');
          chipsEl.innerHTML = chosen.map((t, i) => `
            <span class="tag-chip-token">#${escapeHTML(t)}<button type="button" data-remove-tag="${i}" aria-label="Remove ${escapeHTML(t)}"><svg class="icon"><use href="#icon-x"/></svg></button></span>`).join('');
          tagEntry.placeholder = chosen.length ? '' : 'Add a tag…';
        };
        const addTag = (t) => {
          t = cleanTag(t);
          if (t && !chosen.includes(t)) chosen.push(t);
          tagEntry.value = '';
          syncTags();
          renderSuggest();
        };
        const closeSuggest = () => { suggestEl.hidden = true; tagEntry.setAttribute('aria-expanded', 'false'); active = -1; };
        const renderSuggest = () => {
          const q = cleanTag(tagEntry.value);
          suggestions = known.filter(([t]) => !chosen.includes(t) && (!q || t.includes(q)))
            .sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || (b[1] - a[1])).slice(0, 6);
          if (!suggestions.length || document.activeElement !== tagEntry) { closeSuggest(); return; }
          active = Math.min(active, suggestions.length - 1);
          suggestEl.innerHTML = suggestions.map(([t, n], i) => `
            <div class="tag-suggest-item ${i === active ? 'active' : ''}" role="option" data-suggest="${escapeHTML(t)}" aria-selected="${i === active}">
              <span>#${escapeHTML(t)}</span><small>${n}</small>
            </div>`).join('');
          suggestEl.hidden = false;
          tagEntry.setAttribute('aria-expanded', 'true');
        };
        tagEntry.addEventListener('input', () => {
          if (tagEntry.value.includes(',')) { tagEntry.value.split(',').slice(0, -1).forEach(addTag); tagEntry.value = tagEntry.value.split(',').pop(); }
          active = -1;
          renderSuggest();
        });
        tagEntry.addEventListener('focus', renderSuggest);
        tagEntry.addEventListener('blur', () => { setTimeout(() => { if (tagEntry.value.trim()) addTag(tagEntry.value); closeSuggest(); }, 120); });
        tagEntry.addEventListener('keydown', (e) => {
          const open = !suggestEl.hidden;
          if (e.key === 'ArrowDown' && open) { e.preventDefault(); active = (active + 1) % suggestions.length; renderSuggest(); }
          else if (e.key === 'ArrowUp' && open) { e.preventDefault(); active = active <= 0 ? suggestions.length - 1 : active - 1; renderSuggest(); }
          else if ((e.key === 'Enter' || e.key === 'Tab') && !e.metaKey && !e.ctrlKey && (tagEntry.value.trim() || (open && active >= 0))) {
            e.preventDefault();
            addTag(open && active >= 0 ? suggestions[active][0] : tagEntry.value);
          }
          else if (e.key === 'Backspace' && !tagEntry.value && chosen.length) { chosen.pop(); syncTags(); renderSuggest(); }
          else if (e.key === 'Escape' && open) { e.preventDefault(); e.stopPropagation(); closeSuggest(); }
        });
        suggestEl.addEventListener('mousedown', (e) => {
          const item = e.target.closest('[data-suggest]');
          if (item) { e.preventDefault(); addTag(item.getAttribute('data-suggest')); }
        });
        chipsEl.addEventListener('click', (e) => {
          const rm = e.target.closest('[data-remove-tag]');
          if (rm) { chosen.splice(Number(rm.getAttribute('data-remove-tag')), 1); syncTags(); tagEntry.focus(); }
        });
        document.getElementById('bm-tag-field').addEventListener('mousedown', (e) => {
          if (e.target.id === 'bm-tag-field' || e.target.id === 'bm-tag-chips') { e.preventDefault(); tagEntry.focus(); }
        });
        syncTags();

        // Warn (without blocking) when this URL is already saved
        const dupHint = document.getElementById('bm-dup-hint');
        const checkDuplicate = () => {
          const key = normalizeUrlKey(urlInput.value);
          const dup = key && AppState.data.bookmarks.find(b =>
            b.id !== (existing && existing.id) && normalizeUrlKey(b.url) === key);
          if (dup) {
            const cat = AppState.data.categories.find(c => c.id === dup.categoryId);
            dupHint.textContent = `Already saved as “${dup.title || dup.url}”` +
              (dup.isTrash ? ' (in Trash)' : (dup.isArchived ? ' (in Archive)' : (cat ? ` in ${getCategoryPathString(cat.id, categories)}` : '')));
            dupHint.hidden = false;
          } else {
            dupHint.hidden = true;
          }
        };
        urlInput.oninput = () => { urlInput.classList.remove('invalid'); checkDuplicate(); };
        checkDuplicate();

        const closeModal = () => { modalContainer.innerHTML = ''; };
        document.getElementById('btn-close-modal').onclick = closeModal;
        document.getElementById('btn-cancel-modal').onclick = closeModal;

        // Move to Trash from the edit dialog (undoable)
        const trashBtn = document.getElementById('bm-trash');
        if (trashBtn) trashBtn.onclick = () => {
          const bm = AppState.data.bookmarks.find(b => b.id === existing.id);
          if (!bm) return;
          AppState.recordAction(`Move "${bm.title || 'Bookmark'}" to Trash`);
          bm.isTrash = true;
          AppState.selectedIds.delete(bm.id);
          AppState.saveDirty();
          closeModal();
          renderApp();
          showToast('Moved to Trash', 'info', { label: 'Undo', onClick: () => HistoryManager.undo() });
        };

        // A half-typed tag still counts when saving
        document.getElementById('btn-submit-bookmark').addEventListener('click', () => {
          if (tagEntry.value.trim()) addTag(tagEntry.value);
        });

        document.getElementById('btn-submit-bookmark').onclick = () => {
          let url = urlInput.value.trim();
          if (!url) {
            urlInput.focus();
            urlInput.classList.remove('invalid'); void urlInput.offsetWidth; urlInput.classList.add('invalid');
            showToast('Please enter a URL', 'danger');
            return;
          }
          if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) {
            url = 'https://' + url;
          }
          url = Sanitize.text(url, 8192).trim();
          if (!isSafeUrl(url)) {
            urlInput.focus();
            urlInput.classList.remove('invalid'); void urlInput.offsetWidth; urlInput.classList.add('invalid');
            showToast('Blocked a link with an unsafe address', 'danger');
            return;
          }

          const title = Sanitize.text(titleInput.value.trim() || extractDomain(url), 1000);
          const categoryId = document.getElementById('bm-category').value;
          const tags = Array.from(new Set(
            document.getElementById('bm-tags').value
              .split(',')
              .map(t => Sanitize.text(t.trim().toLowerCase().replace(/^#/, ''), 60).trim())
              .filter(Boolean)
          )).slice(0, 50);
          const description = Sanitize.text(document.getElementById('bm-desc').value.trim(), 10000);
          const isFavorite = document.getElementById('bm-favorite').checked;

          if (isEdit) {
            AppState.recordAction(`Edit Bookmark "${title}"`);
            const bm = AppState.data.bookmarks.find(b => b.id === existing.id);
            if (bm) {
              if (normalizeUrlKey(bm.url) !== normalizeUrlKey(url)) delete bm.favicon; // icon belonged to the old site
              bm.url = url;
              bm.title = title;
              bm.categoryId = categoryId;
              bm.tags = tags;
              bm.description = description;
              bm.isFavorite = isFavorite;
              bm.updatedAt = Date.now();
            }
            showToast('Bookmark updated', 'success', {
              label: 'Undo',
              onClick: () => HistoryManager.undo()
            });
          } else {
            AppState.recordAction(`Add Bookmark "${title}"`);
            AppState.data.bookmarks.unshift({

      /* ===== src/js/16a-category-picker.js ===== */
      /* --------------------------------------------------------------------------
         11A. CATEGORY PICKER
         Replaces a native <select> of categories with a styled dropdown showing each
         category's icon and color. The hidden <select> keeps the value, so existing
         code that reads select.value keeps working.
         Keys: ↑ ↓ Home End to move, Enter/Space to pick, Esc to close, letters to jump.
         -------------------------------------------------------------------------- */
      function enhanceCategorySelect(select) {
        if (!select || select.dataset.enhanced) return;
        select.dataset.enhanced = '1';
        select.classList.add('cs-native');
        select.tabIndex = -1;
        select.setAttribute('aria-hidden', 'true');

        const catById = (id) => AppState.data.categories.find(c => c.id === id);
        const iconHtml = (cat) => cat
          ? `<svg class="icon icon-sm" style="color: ${cat.color};"><use href="#icon-${cat.icon}"/></svg>`
          : '<svg class="icon icon-sm"><use href="#icon-folder"/></svg>';
        const options = () => Array.from(select.options);
        const label = select.id ? document.querySelector(`label[for="${select.id}"]`) : null;

        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'cs-trigger form-select';
        trigger.setAttribute('role', 'combobox');
        trigger.setAttribute('aria-haspopup', 'listbox');
        trigger.setAttribute('aria-expanded', 'false');
        if (label) { label.id = label.id || select.id + '-label'; trigger.setAttribute('aria-labelledby', label.id); }
        select.after(trigger);

        const paint = () => {
          const opt = select.options[select.selectedIndex];
          const cat = opt && catById(opt.value);
          trigger.innerHTML = `${iconHtml(cat)}<span class="cs-value">${escapeHTML(opt ? opt.textContent.trim() : 'Choose…')}</span>`;
        };
        paint();

        let list = null;
        let active = -1;

        const setActive = (i) => {
          const items = list ? Array.from(list.children) : [];
          if (!items.length) return;
          active = (i + items.length) % items.length;
          items.forEach((el, n) => el.classList.toggle('active', n === active));
          items[active].scrollIntoView({ block: 'nearest' });
          list.setAttribute('aria-activedescendant', items[active].id);
        };

        const close = (refocus = true) => {
          if (!list) return;
          list.remove();
          list = null;
          trigger.setAttribute('aria-expanded', 'false');
          document.removeEventListener('mousedown', outside, true);
          window.removeEventListener('resize', reposition);
          document.removeEventListener('scroll', onScroll, true);
          if (refocus) trigger.focus();
        };

        const choose = (i) => {
          const opt = options()[i];
          if (!opt) return;
          const changed = select.value !== opt.value;
          select.value = opt.value;
          paint();
          close();
          if (changed) select.dispatchEvent(new Event('change', { bubbles: true }));
        };

        const reposition = () => {
          if (!list) return;
          const r = trigger.getBoundingClientRect();
          const h = Math.min(list.scrollHeight, 280);
          const below = window.innerHeight - r.bottom - 8;
          list.style.left = r.left + 'px';
          list.style.width = r.width + 'px';
          list.style.top = (below >= Math.min(h, 160) ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + 'px';
        };
        const outside = (e) => { if (list && !list.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) close(false); };
        const onScroll = (e) => { if (list && !list.contains(e.target)) close(false); };

        const open = () => {
          if (list) return;
          list = document.createElement('div');
          list.className = 'cs-list';
          list.setAttribute('role', 'listbox');
          list.tabIndex = -1;
          const base = (select.id || 'cs') + '-opt-';
          list.innerHTML = options().map((opt, i) => {
            const cat = catById(opt.value);
            const depth = Number(opt.dataset.depth || 0);
            const selected = i === select.selectedIndex;
            const labelText = depth > 0 && cat ? cat.name : opt.textContent.trim();
            return `<div class="cs-option${selected ? ' selected' : ''}" role="option" id="${base}${i}" aria-selected="${selected}" data-i="${i}" style="${depth > 0 ? `padding-left: ${10 + depth * 16}px;` : ''}">
              ${depth > 0 ? '<span class="cs-sub-indent">↳</span>' : ''}${iconHtml(cat)}<span>${escapeHTML(labelText)}</span>
              <svg class="icon icon-sm cs-check"><use href="#icon-check"/></svg>
            </div>`;
          }).join('');
          document.body.appendChild(list);
          trigger.setAttribute('aria-expanded', 'true');
          trigger.setAttribute('aria-controls', list.id = base + 'list');
          reposition();
          setActive(Math.max(0, select.selectedIndex));
          list.addEventListener('mousemove', (e) => { const o = e.target.closest('.cs-option'); if (o) setActive(Number(o.dataset.i)); });
          list.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus on the trigger
          list.addEventListener('click', (e) => { const o = e.target.closest('.cs-option'); if (o) choose(Number(o.dataset.i)); });
          document.addEventListener('mousedown', outside, true);
          window.addEventListener('resize', reposition);
          document.addEventListener('scroll', onScroll, true);
        };

        trigger.addEventListener('click', () => (list ? close() : open()));
        trigger.addEventListener('keydown', (e) => {
          const n = options().length;
          const handled = () => { e.preventDefault(); e.stopPropagation(); };
          if (!list) {
            if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { handled(); open(); }
            return;
          }
          if (e.key === 'Escape') { handled(); close(); }
          else if (e.key === 'ArrowDown') { handled(); setActive(active + 1); }
          else if (e.key === 'ArrowUp') { handled(); setActive(active - 1); }
          else if (e.key === 'Home') { handled(); setActive(0); }
          else if (e.key === 'End') { handled(); setActive(n - 1); }
          else if (e.key === 'Enter' || e.key === ' ') { handled(); choose(active); }
          else if (e.key === 'Tab') { close(false); }
          else if (e.key.length === 1 && /\S/.test(e.key)) {
            // type-ahead: jump to the next category starting with that letter
            const k = e.key.toLowerCase();
            const opts = options();
            for (let step = 1; step <= n; step++) {
              const i = (active + step) % n;
              if (opts[i].textContent.trim().toLowerCase().startsWith(k)) { handled(); setActive(i); break; }
            }
          }
        });

        // If code changes the hidden select, keep the trigger in sync
        select.addEventListener('change', paint);
        // Clean up a popup left open when the dialog closes
        const observer = new MutationObserver(() => { if (!trigger.isConnected) { close(false); observer.disconnect(); } });
        observer.observe(document.getElementById('modal-container'), { childList: true });
        return trigger;
      }

      /* ===== src/js/17-modal-category.js ===== */
      function openCategoryModal(existing = null, defaultParentId = '') {
        const isEdit = !!(existing && existing.id);

          '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316', '#eab308',

          'folder', 'code', 'palette', 'sparkles', 'globe', 'book-open',
          'bookmark', 'tag', 'clock', 'star'

        const categories = AppState.data.categories;
        const initialParentId = isEdit ? (existing.parentId || '') : (defaultParentId || '');
        const parentCat = initialParentId ? categories.find(c => c.id === initialParentId) : null;

        let selectedColor = existing?.color || (parentCat && parentCat.color) || colorPalette[0];
        let selectedIcon = existing?.icon || iconList[0];

        // Exclude self and descendants from valid parent options
        const forbiddenIds = isEdit ? getCategoryDescendants(existing.id, categories) : new Set();
        const validParents = getCategoryTree(categories).filter(({ cat }) => !forbiddenIds.has(cat.id));

        const modalContainer = document.getElementById('modal-container');
        modalContainer.innerHTML = `
          <div class="modal-overlay active" id="cat-modal-overlay">
            <div class="modal">
              <div class="modal-header">
                <h3 class="modal-title">${isEdit ? 'Edit Category' : (initialParentId ? 'New Subcategory Folder' : 'New Category')}</h3>
                <button class="btn btn-icon-only" id="btn-close-modal">
                  <svg class="icon"><use href="#icon-x"/></svg>
                </button>
              </div>

              <div class="modal-body">
                <div class="form-group">
                  <label class="form-label" for="cat-name">Category Name *</label>
                  <input
                    type="text"
                    class="form-input"
                    id="cat-name"
                    placeholder="${initialParentId ? 'e.g. Frontend, APIs, Inspiration' : 'e.g. Design Systems'}"

                  />
                </div>

                <div class="form-group">
                  <label class="form-label" for="cat-parent">Parent Folder <span class="form-label-hint">optional — creates a subcategory</span></label>
