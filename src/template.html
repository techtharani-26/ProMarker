<!DOCTYPE html>
<html lang="en"{{THEME_ATTR}}><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="promarker-build" content="{{BUILD_ID}}">
  <!-- Security policy: only the exact app script below may run (pinned by its SHA-256 hash).
       Injected scripts, inline event handlers and javascript: links are blocked; nothing is
       loaded from the network except favicon images (fonts are embedded). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '{{SCRIPT_HASH}}'; style-src 'unsafe-inline'; img-src https: data:; font-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>ProMarker — Smart Self-Saving Bookmark Hub</title>
  <!-- Generated by build.js from src/ — edit the files in src/, not this file. -->
  <style>
{{STYLES}}
  </style>
</head>
<body>

  <!-- SVG SPRITE ICONS (src/icons.svg) -->
{{ICONS}}

  <!-- APP CONTAINER (Dynamic UI is mounted here) -->
  <div id="app" class="app-container"></div>

  <!-- Dialogs live outside #app so re-rendering the app never closes them -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- DATA STORE: your bookmarks live here (rewritten on every save) -->
  <script id="promarker-data" type="application/json">
{{DATA}}
</script>

  <!-- APPLICATION SCRIPT (src/js/*.js, concatenated in file-name order) -->
  <script>
    (function () {
      'use strict';

{{SCRIPT}}
    })();
  </script>
</body></html>
